    const v = voiture;
    const x = v.vue ? v.x : v.attendu.x, y = v.vue ? v.y : v.attendu.y;
    ajouter(x, y, autour, 0);
    // En attendant l'itinéraire : la bande entre départ et arrivée.
    if (VERS && !itineraire && devant === Infinity) {
        const l = Math.hypot(VERS.x - x, VERS.y - y);
        for (let t = 0; t <= l; t += CARRE_M / 2) ajouter(x + (VERS.x - x) * t / l, y + (VERS.y - y) * t / l, ITINERAIRE_BANDE_M, t);
    }
    const ch = v.chemin;
    if (ch) {
        const d0 = v.dChemin, fin = Math.min(ch.longueur, d0 + devant);
        for (let d = d0 + PAS_COULOIR_M; d < fin; d += PAS_COULOIR_M) {
            const p = pointDuChemin(ch, d);
            ajouter(p.x, p.y, couloir, d - d0);
        }
        // Au bout d'une route encore inconnue : le carré suivant, d'abord.
        if (ch.fin === 'inconnu' && devant === Infinity) ajouter(ch.bout[0], ch.bout[1], 1, ch.longueur - d0 - 200);
        // Une impasse devant : on ne sait plus par où la voiture repartira,
        // tout autour d'elle, plus loin.
        if (ch.fin === 'impasse') ajouter(x, y, impasse, 0);
    } else if (v.vue && v.v > 2) {
        for (let d = PAS_COULOIR_M; d <= Math.min(1500, devant); d += PAS_COULOIR_M) {
            ajouter(x + d * Math.sin(v.cap * RAD), y + d * Math.cos(v.cap * RAD), couloir, d);
        }
    }
    return [...voulus.values()].sort((a, b) => a.p - b.p).slice(0, CARRES_VOULUS_MAX);
}

let budgetConstruction = 0;
const durees = [];                     // [ms, bâtiments] des dernières constructions, pour les essais
const dureesArbres = [];               // [ms, arbres], de même
function majCarres(maintenant) {
    if (maintenant - derniereSelectionCarres >= 300 && (voiture.vue || (voiture.attendu && !voiture.attendu.provisoire))) {
        derniereSelectionCarres = maintenant;
        const voulus = carresVoulus();
        const cles = new Set();
        for (const { i, j, p } of voulus) {
            const c = carre(i, j);
            c.voulu = maintenant;
            c.priorite = p;
            cles.add(c.cle);
        }
        for (const { i, j } of voulus) {
            if (carresEnVol >= CARRES_PARALLELE) break;
            const c = carre(i, j);
            if (c.etat === 'neuf' || (c.etat === 'erreur' && maintenant >= c.reessai)) chargerCarre(c);
        }
        // Les arbres, après les bâtiments et plus près de la route.
        const vegCles = new Set();
        if (arbresActifs) {
            const vegVoulus = carresVoulus(VEG_AUTOUR_M, VEG_COULOIR_M, VEG_DEVANT_M, VEG_IMPASSE_M);
            for (const { i, j, p } of vegVoulus) {
                const c = carre(i, j);
                c.veg.voulu = maintenant;
                c.veg.priorite = p;
                vegCles.add(c.cle);
            }
            for (const { i, j } of vegVoulus) {
                if (vegEnVol >= VEG_PARALLELE) break;
                const c = carre(i, j);
                if (c.veg.etat === 'neuf' || (c.veg.etat === 'erreur' && maintenant >= c.veg.reessai)) chargerVegetation(c);
            }
        }
        const px = voiture.vue ? voiture.x : voiture.attendu.x, py = voiture.vue ? voiture.y : voiture.attendu.y;
        for (const c of [...carres.values()]) {
            const voulu = cles.has(c.cle);
            if (c.mesh) c.mesh.visible = voulu;
            if (c.routes) c.routes.visible = voulu;
            if (c.veg.mesh) c.veg.mesh.visible = vegCles.has(c.cle);
            if (!vegCles.has(c.cle) && c.veg.mesh && maintenant - c.veg.voulu > CARRE_DEFAIT_S * 1000) defaireVegetation(c);
            if (!voulu && c.mesh && maintenant - c.voulu > CARRE_DEFAIT_S * 1000) defaireCarre(c);
            if (!voulu && c.etat !== 'charge' && c.veg.etat !== 'charge' && maintenant - c.voulu > CARRE_OUBLI_S * 1000
                && maintenant - c.veg.voulu > CARRE_OUBLI_S * 1000
                && Math.hypot((c.i + 0.5) * CARRE_M - px, (c.j + 0.5) * CARRE_M - py) > CARRE_OUBLI_M) {
                defaireCarre(c);
                defaireVegetation(c);
                if (c.donnees) retirerRoutes(c);
                carres.delete(c.cle);
            }
        }
    }
    // Un carré construit par image au plus, dans l'ordre de la route : la
    // voiture ne saccade pas quand une rafale arrive. Bâtiments seuls :
    // médiane de 3,8 ms à Paris et de 4,8 ms à Lyon, 14,7 ms au pire (398
    // bâtiments, Chrome sur Mac M4) ; routes et ponts compris, 5,6 ms à
    // Paris, 10,7 ms au pire. Une machine trois fois plus lente reste sous
    // les 50 ms.
    budgetConstruction = 0;
    let meilleur = null;
    for (const c of carres.values()) {
        if (c.etat === 'pret' && !c.mesh && c.altiPretes && c.voulu >= derniereSelectionCarres - 1
            && (!meilleur || c.priorite < meilleur.priorite)) meilleur = c;
    }
    // Et les arbres d'un carré par image, de même.
    let arbres = null;
    for (const c of carres.values()) {
        const g = c.veg;
        if (g.etat === 'pret' && !g.mesh && g.altiPretes && g.voulu >= derniereSelectionCarres - 1
            && (!arbres || g.priorite < arbres.veg.priorite)) arbres = c;
    }
    if (arbres && arbresActifs) {
        const t0 = performance.now();
        construireVegetation(arbres);
        dureesArbres.push([performance.now() - t0, arbres.veg.donnees.arbres.length]);
        if (dureesArbres.length > 200) dureesArbres.shift();
    }
    if (meilleur) {
        const t0 = performance.now();
        construireCarre(meilleur);
        budgetConstruction = performance.now() - t0;
        durees.push([budgetConstruction, meilleur.nbBatiments]);
        if (durees.length > 200) durees.shift();
    }
}

// --- Graphe des routes -------------------------------------------------------------
// Les tronçons de tous les carrés lus, réunis par leurs extrémités (au
// décimètre près, la précision des carrés : celles d'un même nœud sont
// identiques), et indexés par cellules de 50 m pour caler la voiture.
const noeuds = new Map(), aretes = new Map(), grille = new Map();
const CELLULE_M = 50;

function noeud(cle, x, y) {
    let n = noeuds.get(cle);
    if (!n) { n = { cle, x, y, aretes: [] }; noeuds.set(cle, n); }
    return n;
}
function cellules(a, k, faire) {
    const x0 = a.pts[2 * k], y0 = a.pts[2 * k + 1], x1 = a.pts[2 * k + 2], y1 = a.pts[2 * k + 3];
    for (let i = Math.floor(Math.min(x0, x1) / CELLULE_M); i <= Math.floor(Math.max(x0, x1) / CELLULE_M); i++) {
        for (let j = Math.floor(Math.min(y0, y1) / CELLULE_M); j <= Math.floor(Math.max(y0, y1) / CELLULE_M); j++) {
            faire(`${i},${j}`);
        }
    }
}

function integrerRoutes(c) {
    const [ox, oy] = c.donnees.origine;
    for (const r of c.donnees.routes) {
        const deja = aretes.get(r.id);
        if (deja) { deja.carres.add(c.cle); continue; }
        const n = r.ligne.length / 3;
        if (n < 2) continue;
        const pts = new Float64Array(2 * n), z = new Float64Array(n), cum = new Float64Array(n);
        for (let k = 0; k < n; k++) {
            pts[2 * k] = (ox * 10 + r.ligne[3 * k]) / 10;
            pts[2 * k + 1] = (oy * 10 + r.ligne[3 * k + 1]) / 10;
            z[k] = r.ligne[3 * k + 2] == null ? NaN : r.ligne[3 * k + 2] / 10;
            if (k) cum[k] = cum[k - 1] + Math.hypot(pts[2 * k] - pts[2 * k - 2], pts[2 * k + 1] - pts[2 * k - 1]);
        }
        const cleDe = k => `${ox * 10 + r.ligne[3 * k]},${oy * 10 + r.ligne[3 * k + 1]}`;
        const a = { ...r, pts, z, cum, L: cum[n - 1], carres: new Set([c.cle]) };
        delete a.ligne;
        a.n0 = noeud(cleDe(0), pts[0], pts[1]);
        a.n1 = noeud(cleDe(n - 1), pts[2 * n - 2], pts[2 * n - 1]);
        if (a.L < 0.05) continue;
        a.n0.aretes.push(a);
        if (a.n1 !== a.n0) a.n1.aretes.push(a);
        aretes.set(r.id, a);
        for (let k = 0; k < n - 1; k++) cellules(a, k, cle => {
            let l = grille.get(cle);
            if (!l) grille.set(cle, l = []);
            l.push({ a, k });
        });
    }
}

function retirerRoutes(c) {
    for (const r of c.donnees.routes) {
        const a = aretes.get(r.id);
        if (!a) continue;
        a.carres.delete(c.cle);
        if (a.carres.size) continue;
        aretes.delete(r.id);
        for (const nd of [a.n0, a.n1]) {
            nd.aretes = nd.aretes.filter(b => b !== a);
            if (!nd.aretes.length) noeuds.delete(nd.cle);
        }
        for (let k = 0; k < a.pts.length / 2 - 1; k++) cellules(a, k, cle => {
            const l = grille.get(cle);
            if (!l) return;
            const reste = l.filter(e => e.a !== a);
            if (reste.length) grille.set(cle, reste); else grille.delete(cle);
        });
    }
    c.donnees = null;

/** Point de l'arête `a` à l'abscisse `s`, et son cap (degrés, du nord du quadrillage) dans le sens `sens`. */
function pointArete(a, s, sens = 1) {
    s = Math.min(Math.max(s, 0), a.L);
    let k = 0;
    while (k < a.cum.length - 2 && a.cum[k + 1] < s) k++;
    const l = a.cum[k + 1] - a.cum[k] || 1, u = (s - a.cum[k]) / l;
    const x0 = a.pts[2 * k], y0 = a.pts[2 * k + 1], x1 = a.pts[2 * k + 2], y1 = a.pts[2 * k + 3];
    const cap = Math.atan2((x1 - x0) * sens, (y1 - y0) * sens) / RAD;
    const z = a.z[k] + (a.z[k + 1] - a.z[k]) * u;
    return { x: x0 + (x1 - x0) * u, y: y0 + (y1 - y0) * u, cap, z, k };

/** Cap de l'arête au départ du nœud `n`, mesuré sur ses `l` premiers mètres. */
function capDepuis(a, n, l = 15) {

const ecartCap = (a, b) => ((a - b + 540) % 360) - 180;
const memeVoie = (a, b) => (a.numero && a.numero === b.numero) || (a.nom && a.nom === b.nom);

/**
 * Les suites possibles au nœud `n` pour qui arrive par `a` au cap `capArrivee`,
 * de la plus probable à la moins : tout droit, sur la même voie, de même
 * importance, en voiture. Les sens interdits sont écartés, le demi-tour aussi.
 */
function suites(a, n, capArrivee) {
    const options = [];
    for (const b of n.aretes) {
        if (b === a || b.n0 === b.n1 || !permise(b, n)) continue;
        const virage = Math.abs(ecartCap(capDepuis(b, n), capArrivee));
        if (virage > 160) continue;
        let score = virage + 12 * Math.abs(b.importance - a.importance);
        if (memeVoie(a, b)) score -= 30;
        if (b.nature === 'Chemin' || b.nature === 'Route empierrée') score += 40;
        if (b.nature === 'Bretelle' && a.nature !== 'Bretelle') score += 25;
        if (b.acces && b.acces.startsWith('Restreint') && !a.acces) score += 60;

        // finissait au bout de 250 à 800 m quand la rue continuait ailleurs,
        // et plus rien ne se chargeait au-delà.
        const bout = b.n0 === n ? b.n1 : b.n0;
        if (bout.aretes.length === 1 && carrePret(bout.x, bout.y)) score += CUL_DE_SAC;

const carrePret = (x, y) => carreDe(x, y)?.etat === 'pret';

// Sur un rond-point, la suite « la plus droite » est l'anneau lui-même : la

    if (!options.length) return null;
    let choix = options[0];
    if (a.nature === 'Rond-point' && etat.capEntree != null) {
        etat.tours = (etat.tours || 0) + 1;

            .map(o => ({ o, ecart: Math.abs(ecartCap(capDepuis(o.a, n), etat.capEntree)) }))

            bout = [n.x, n.y];
            break;
        }
        ({ a, sens } = suite);
        s = sens > 0 ? 0 : a.L;
    }
    if (!bout) bout = [xs[xs.length - 1], ys[ys.length - 1]];
    return { xs, ys, cum, longueur: total, fin, bout, parcours };
}

/** Point du chemin à la distance `d` de son début, avec son cap ; null hors du chemin. */
function pointDuChemin(ch, d) {

    // Un chemin d'un seul point : la voiture calée pile sur l'arrivée. Le
    // préchargement et le panneau y cherchaient un point, et la page
    // s'arrêtait là (le film de la Bastille à la Nation, à l'arrivée).

/**

 */
function caler(x, y, precision, cap) {
    // Large : en ville, le GPS s'égare de 20 à 30 m quand il en annonce 8 ;
    // le cap et la route prévue départagent les voisines.
    const rayon = Math.min(Math.max(precision * 2.5, 25), 60);
    const vus = new Set();
    const surChemin = new Set(voiture.chemin ? voiture.chemin.parcours.map(p => p.a) : []);
    let meilleur = null;
    for (let i = Math.floor((x - rayon) / CELLULE_M); i <= Math.floor((x + rayon) / CELLULE_M); i++) {
        for (let j = Math.floor((y - rayon) / CELLULE_M); j <= Math.floor((y + rayon) / CELLULE_M); j++) {
            for (const { a, k } of grille.get(`${i},${j}`) || []) {
                const cleSeg = a.id + ':' + k;
                if (vus.has(cleSeg)) continue;
                vus.add(cleSeg);
                const x0 = a.pts[2 * k], y0 = a.pts[2 * k + 1], x1 = a.pts[2 * k + 2], y1 = a.pts[2 * k + 3];
                const lx = x1 - x0, ly = y1 - y0, l2 = lx * lx + ly * ly || 1;
                const u = Math.min(Math.max(((x - x0) * lx + (y - y0) * ly) / l2, 0), 1);
                const px = x0 + lx * u, py = y0 + ly * u;
                const d = Math.hypot(x - px, y - py);
                if (d > rayon) continue;
                const capSeg = Math.atan2(lx, ly) / RAD;
                let sens = 1, penalite = 0;
                if (cap != null) {
                    const ecartDirect = Math.abs(ecartCap(cap, capSeg)), ecartInverse = Math.abs(ecartCap(cap, capSeg + 180));
                    const directOk = a.sens !== '-', inverseOk = a.sens !== '+';
                    if (directOk && (!inverseOk || ecartDirect <= ecartInverse)) { sens = 1; penalite = ecartDirect; }
                    else { sens = -1; penalite = ecartInverse; }
                    penalite = 25 * (1 - Math.cos(penalite * RAD));
                } else if (voiture.ancre && voiture.ancre.a === a) {
                    sens = voiture.ancre.sens;
                }
                if (a.sol < 0) penalite += 6;            // un tunnel ne se prend pas par erreur
                const score = d + penalite - (surChemin.has(a) ? 8 : 0);
                if (!meilleur || score < meilleur.score) {
                    meilleur = { score, a, sens, s: a.cum[k] + Math.sqrt(l2) * u, x: px, y: py };
                }
            }
        }
    }
    // Sur l'itinéraire, son sens : à l'arrêt, sans cap, la voiture se
    // calait dans l'autre, et la route prévue repartait au hasard.
    if (meilleur && itineraire) {
        const e = itineraire.etapes.find(e => e.a === meilleur.a);
        if (e) meilleur.sens = e.sens;
    }
    return meilleur;
}

// --- La voiture ---------------------------------------------------------------------
// Un relevé par seconde au mieux : entre deux, la voiture avance le long de
// la route prévue à sa vitesse, et l'image se raccorde en douceur au relevé
// suivant. Sans relevé, elle s'arrête au bout de EXTRAPOLATION_S (bien plus
// tard dans un tunnel, où le GPS ne capte plus).
const EXTRAPOLATION_S = 3, EXTRAPOLATION_TUNNEL_S = 40;
const LISSAGE_POSITION_S = 0.3, LISSAGE_CAP_S = 0.35;
const SAUT_M = 150;
const voiture = {
    fix: null, ancre: null, chemin: null, dChemin: 0, recalculer: false,
    vue: false, x: 0, y: 0, alt: 0, cap: 0, v: 0, precision: 0, horsRoute: true,
    attendu: null,                    // le départ, avant le premier relevé
};

function longueurPrevue() {
    // Deux minutes et demie de route devant soi, de 2 à 6 km : à 130 km/h,
    // 5,4 km, lus en quelques secondes (0,2 s par carré, quatre à la fois).
    return Math.min(Math.max(voiture.v * 150, 2000), 6000);
}

function recalculerChemin() {
    voiture.recalculer = false;
    const an = voiture.ancre;
    if (!an || !an.a) { voiture.chemin = null; return; }
    // Le chemin part de la position affichée, pas du relevé : il garde la
    // même abscisse pour la voiture, que la boucle fait avancer.
    // Sur un itinéraire, jusqu'à l'arrivée (20 km au plus) : la distance qui
    // reste se lit dès le départ.
    voiture.chemin = cheminDepuis(an, itineraire ? ITINERAIRE_CHEMIN_MAX_M : longueurPrevue());
    voiture.dChemin = 0;
    voiture.tChemin = an.t;
}

const HISTORIQUE_S = 4;
const historique = [];
function recevoirPosition(pos) {
    const c = pos.coords;
    const [x, y] = versLambert93(c.longitude, c.latitude);
    const maintenant = performance.now();
    let v = Number.isFinite(c.speed) && c.speed != null ? c.speed : null;
    let cap = Number.isFinite(c.heading) && c.heading != null && (v == null || v > 1)
        ? c.heading - convergence(c.longitude) : null;
    // Sans vitesse ni cap du GPS : tirés des relevés des dernières secondes,
    // pas des deux derniers, que leur bruit de quelques mètres faisait
    // tourner de 40° à 30 km/h.
    historique.push({ x, y, t: maintenant });
    while (historique.length > 2 && maintenant - historique[0].t > HISTORIQUE_S * 1000) historique.shift();
    const ancien = historique[0], dt = (maintenant - ancien.t) / 1000;
    const d = Math.hypot(x - ancien.x, y - ancien.y);
    if (v == null && dt > 0.8) v = d / dt;
    if (cap == null && d > 10) cap = Math.atan2(x - ancien.x, y - ancien.y) / RAD;
    voiture.fix = { x, y, t: maintenant, precision: c.accuracy || 30, v: v || 0, cap,
                    lon: c.longitude, lat: c.latitude };
    voiture.precision = voiture.fix.precision;
    if (!voiture.vue) {
        voiture.vue = true;
        if (Math.hypot(x - ORIGINE.x, y - ORIGINE.y) > RECALAGE_M) recaler(x, y);
        voiture.x = x; voiture.y = y;
        voiture.cap = cap ?? 0;
        camVue.cap = voiture.cap;
        document.getElementById('accueil').hidden = true;
        // La France vue de haut, en attendant : on descend derrière la voiture.
        if (voiture.attendu?.provisoire) {
            camVue.mode = PARAMS.get('vue') === '2d' ? '2d' : '3d';
            camVue.hauteur = HAUTEUR_DEFAUT;
            majBoutonVue();
        }
        majLienQuitter();
    }
    calerReleve();
}

function calerReleve() {
    const f = voiture.fix;
    const m = caler(f.x, f.y, f.precision, f.v > 1.5 ? f.cap : null);
    voiture.horsRoute = !m;
    if (m) {
        voiture.ancre = { a: m.a, s: m.s, sens: m.sens, x: m.x, y: m.y, t: f.t, v: f.v };
    } else {
        voiture.ancre = { a: null, x: f.x, y: f.y, t: f.t, v: f.v, cap: f.cap };
    }
    recalculerChemin();
    // Le relevé arrive un peu derrière la voiture affichée, qui a filé sur
    // sa lancée : elle garde son avance plutôt que de reculer, pourvu
    // qu'elle soit sur la route prévue, devant le relevé.
    const ch = voiture.chemin, an = voiture.ancre;
    if (ch && an.v > 1) {
        const d = abscisseSurChemin(ch, voiture.x, voiture.y, Math.max(20, 2.5 * an.v));
        if (d != null && d > 0) an.t = performance.now() - d / an.v * 1000;
    }
}

/** Abscisse sur le chemin du point le plus proche de (x, y) parmi ses `dMax` premiers mètres, à moins de 10 m. */
function abscisseSurChemin(ch, x, y, dMax) {
    let meilleur = null;
    for (let k = 0; k + 1 < ch.xs.length && ch.cum[k] <= dMax; k++) {
        const lx = ch.xs[k + 1] - ch.xs[k], ly = ch.ys[k + 1] - ch.ys[k], l2 = lx * lx + ly * ly || 1;
        const u = Math.min(Math.max(((x - ch.xs[k]) * lx + (y - ch.ys[k]) * ly) / l2, 0), 1);
        const d = Math.hypot(x - ch.xs[k] - lx * u, y - ch.ys[k] - ly * u);
        if (d < 10 && (!meilleur || d < meilleur.d)) meilleur = { d, s: ch.cum[k] + Math.sqrt(l2) * u };
    }
    return meilleur && meilleur.s <= dMax ? meilleur.s : null;
}

function majVoiture(dt, maintenant) {
    const v = voiture;
    if (!v.vue) return;
    if (v.recalculer && v.fix) calerReleve();
    const an = v.ancre;
    // Le dernier relevé tombe avant l'entrée du tunnel : c'est le tronçon où
    // la voiture arrive sur sa lancée qui compte.
    const depuis = (maintenant - an.t) / 1000;
    let limite = EXTRAPOLATION_S;
    if (v.chemin && an.v > 1 && depuis > EXTRAPOLATION_S
        && areteDuChemin(v.chemin, an.v * EXTRAPOLATION_S).a.sol < 0) limite = EXTRAPOLATION_TUNNEL_S;
    const ecoule = Math.min(depuis, limite);
    let cx, cy, ccap;
    const p = v.chemin && pointDuChemin(v.chemin, an.v * ecoule);
    if (p) {
        v.dChemin = an.v * ecoule;
        cx = p.x; cy = p.y; ccap = p.cap;
    } else {
        const cap = an.cap ?? v.cap;
        cx = an.x + an.v * ecoule * Math.sin(cap * RAD);
        cy = an.y + an.v * ecoule * Math.cos(cap * RAD);
        ccap = cap;
    }
    const k = 1 - Math.exp(-dt / LISSAGE_POSITION_S);
    if (Math.hypot(cx - v.x, cy - v.y) > SAUT_M) { v.x = cx; v.y = cy; }
    else { v.x += (cx - v.x) * k; v.y += (cy - v.y) * k; }
    // À l'arrêt, le cap reste : le GPS n'en donne plus, ou un faux.
    if (an.v > 0.8) v.cap += ecartCap(ccap, v.cap) * (1 - Math.exp(-dt / LISSAGE_CAP_S));
    // Figée faute de relevé, la voiture affiche 0, pas sa dernière vitesse.
    v.v += ((depuis > limite ? 0 : an.v || 0) - v.v) * (1 - Math.exp(-dt / 0.8));
    // L'altitude : celle du relief, sauf sur un pont, où la route BD TOPO
    // porte la sienne ; lissée, pour ne pas sauter d'une tuile à l'autre.
    let alt = altitudeL93(v.x, v.y);
    if (p && an.a) {
        const e = areteDuChemin(v.chemin, v.dChemin);
        if (e.a.sol > 0) {
            const z = pointArete(e.a, e.s).z;
            if (Number.isFinite(z)) alt = Number.isFinite(alt) ? Math.max(alt, z) : z;
        }
        v.arete = e.a;
    } else {
        v.arete = null;
    }
    if (Number.isFinite(alt)) v.alt = v.altPret ? v.alt + (alt - v.alt) * (1 - Math.exp(-dt / 0.25)) : alt;
    v.altPret = v.altPret || Number.isFinite(alt);
    if (Math.hypot(v.x - ORIGINE.x, v.y - ORIGINE.y) > RECALAGE_M) recaler(v.x, v.y);
    poserVoiture();
}

// --- Maquette de la voiture --------------------------------------------------------
// Une berline stylisée, à l'échelle (4,7 × 1,85 m), grossie avec le recul de
// la caméra comme l'icône d'un GPS : à 70 m, une voiture réelle tiendrait
// dans 4 % de la largeur de l'écran.
const maquette = new THREE.Group();
const MAT_CAISSE = new THREE.MeshLambertMaterial({ color: 0xf2f4f6 });
const MAT_VITRES = new THREE.MeshLambertMaterial({ color: 0x1b2430 });
const MAT_PNEUS = new THREE.MeshLambertMaterial({ color: 0x15171a });
const MAT_PHARES = new THREE.MeshBasicMaterial({ color: 0xfffbe8 });
const MAT_FEUX = new THREE.MeshBasicMaterial({ color: 0xe0242a });
(function construireMaquette() {
    const extruder = (forme, largeur, mat) => {
        const geo = new THREE.ExtrudeGeometry(forme, { depth: largeur, bevelEnabled: true, bevelThickness: 0.06,
                                                       bevelSize: 0.06, bevelSegments: 2, curveSegments: 8 });
        geo.translate(0, 0, -largeur / 2);
        return new THREE.Mesh(geo, mat);
    };
    const caisse = new THREE.Shape();
    caisse.moveTo(-2.3, 0.3); caisse.lineTo(2.2, 0.3);
    caisse.quadraticCurveTo(2.36, 0.32, 2.36, 0.56);
    caisse.quadraticCurveTo(2.32, 0.8, 1.95, 0.86);
    caisse.lineTo(0.95, 0.95); caisse.lineTo(-1.9, 0.98); caisse.lineTo(-2.1, 0.95);
    caisse.quadraticCurveTo(-2.3, 0.92, -2.32, 0.7); caisse.lineTo(-2.3, 0.3);
    maquette.add(extruder(caisse, 1.74, MAT_CAISSE));
    // Une lunette arrière longue et couchée, en fastback : droite, elle
    // donnait à la voiture vue de derrière l'air d'une camionnette.
    const verriere = new THREE.Shape();
    verriere.moveTo(0.95, 0.94);
    verriere.quadraticCurveTo(0.35, 1.36, -0.15, 1.4);
    verriere.quadraticCurveTo(-1.1, 1.4, -1.9, 0.97);
    verriere.lineTo(0.95, 0.94);
    maquette.add(extruder(verriere, 1.42, MAT_VITRES));
    // Le pavillon, couleur de caisse, posé sur la verrière entre le pare-brise
    // et la lunette (les courbes de celle-ci passent par 1,356 m en x = 0,1
    // et par 1,331 m en x = −0,89) : vue d'en haut, une berline et non une
    // vitre d'un seul tenant.
    const pavillon = new THREE.Shape();
    pavillon.moveTo(0.1, 1.33); pavillon.lineTo(0.1, 1.372);
    pavillon.quadraticCurveTo(-0.2, 1.43, -0.89, 1.35); pavillon.lineTo(-0.89, 1.31);
    pavillon.lineTo(0.1, 1.33);
    maquette.add(extruder(pavillon, 1.28, MAT_CAISSE));
    const roue = new THREE.CylinderGeometry(0.34, 0.34, 0.26, 18);
    roue.rotateX(Math.PI / 2);
    for (const [x, z] of [[1.42, 0.82], [1.42, -0.82], [-1.42, 0.82], [-1.42, -0.82]]) {
        const r = new THREE.Mesh(roue, MAT_PNEUS);
        r.position.set(x, 0.34, z);
        maquette.add(r);
    }
    const feu = new THREE.BoxGeometry(0.08, 0.1, 0.42);
    for (const z of [0.58, -0.58]) {
        const p = new THREE.Mesh(feu, MAT_PHARES); p.position.set(2.36, 0.66, z); maquette.add(p);
        const f = new THREE.Mesh(feu, MAT_FEUX); f.position.set(-2.36, 0.8, z); maquette.add(f);
    }
    // L'ombre : une tache douce sous la caisse, sans carte d'ombre.
    const toile = document.createElement('canvas');
    toile.width = toile.height = 64;
    const g = toile.getContext('2d'), grad = g.createRadialGradient(32, 32, 4, 32, 32, 32);
    grad.addColorStop(0, 'rgba(0,0,0,0.55)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    const ombre = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 2.8),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(toile), transparent: true, depthWrite: false }));
    ombre.rotation.x = -Math.PI / 2;
    ombre.position.y = 0.06;
    maquette.add(ombre);
})();
maquette.visible = false;
// Dessinée après le reste, profondeur effacée : toujours visible, comme le
// repère d'un GPS, avec ses propres lumières (une lumière n'est que dans
// une scène).
const sceneVoiture = new THREE.Scene();
const ambianceVoiture = new THREE.HemisphereLight(0xdfe8f5, 0x5a5348, 1.5);
const soleilVoiture = new THREE.DirectionalLight(0xfff2dd, 2.0);
sceneVoiture.add(maquette, ambianceVoiture, soleilVoiture, soleilVoiture.target);
// Le halo de la précision du relevé, à plat, à l'échelle réelle.
const halo = new THREE.Mesh(new THREE.CircleGeometry(1, 48),
    new THREE.MeshBasicMaterial({ color: 0x3d8bff, transparent: true, opacity: 0.16, depthWrite: false }));
halo.rotation.x = -Math.PI / 2;
halo.visible = false;
scene.add(halo);

function echelleMaquette() {
    return camVue.mode === '2d' ? Math.min(Math.max(camVue.hauteur / 40, 2), 12)
                                : Math.min(Math.max(camVue.recul / 24, 1), 7);
}
function poserVoiture() {
    const v = voiture;
    maquette.visible = true;
    maquette.position.set(v.x - ORIGINE.x, v.alt + 0.05, ORIGINE.y - v.y);
    maquette.rotation.y = Math.PI / 2 - v.cap * RAD;
    maquette.scale.setScalar(echelleMaquette());
    uniformsBati.uVoiture.value.set(maquette.position.x, maquette.position.y + 1.5 * maquette.scale.x, maquette.position.z);
    uniformsBati.uRayon.value = camVue.mode === '3d' ? 9 + 3 * maquette.scale.x : 0;
    halo.visible = v.horsRoute || v.precision > 12;
    halo.position.set(v.fix.x - ORIGINE.x, v.alt + 0.2, ORIGINE.y - v.fix.y);
    halo.scale.setScalar(Math.max(v.precision, 3));
}

// --- La route prévue, en ruban -----------------------------------------------------
// Le kilomètre suivant, en bleu transparent, comme l'itinéraire d'un GPS :
// c'est la route que la page suppose, et le long de laquelle elle charge.
const RUBAN_M = 1200, RUBAN_PAS_M = 8, RUBAN_LARGEUR_M = 5;
const MAT_RUBAN = courber(new THREE.MeshBasicMaterial({ color: 0x3d8bff, transparent: true, opacity: 0.5,
    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -8 }));
const ruban = new THREE.Mesh(new THREE.BufferGeometry(), MAT_RUBAN);
ruban.frustumCulled = false;
ruban.renderOrder = 2;
scene.add(ruban);
let dernierRuban = -Infinity;
function majRuban(maintenant) {
    if (maintenant - dernierRuban < 250) return;
    dernierRuban = maintenant;
    const ch = voiture.chemin;
    if (!ch || !voiture.vue) { ruban.visible = false; return; }
    const pos = [], idx = [];
    const d0 = voiture.dChemin + 4 * echelleMaquette(), d1 = Math.min(voiture.dChemin + RUBAN_M, ch.longueur);
    const largeur = RUBAN_LARGEUR_M * Math.min(Math.max(echelleMaquette() * 0.6, 1), 4);
    for (let d = d0; d <= d1; d += RUBAN_PAS_M) {
        const p = pointDuChemin(ch, d);
        const e = areteDuChemin(ch, d);
        let alt = altitudeL93(p.x, p.y);
        if (e.a.sol > 0) { const z = pointArete(e.a, e.s).z; if (Number.isFinite(z)) alt = Math.max(alt || -1e9, z); }
        if (!Number.isFinite(alt)) alt = voiture.alt;
        const nx = Math.cos(p.cap * RAD) * largeur / 2, ny = -Math.sin(p.cap * RAD) * largeur / 2;
        const k = pos.length / 3;
        pos.push(p.x - nx - ORIGINE.x, alt + 0.6, ORIGINE.y - (p.y - ny),
                 p.x + nx - ORIGINE.x, alt + 0.6, ORIGINE.y - (p.y + ny));
        if (k) idx.push(k - 2, k - 1, k, k - 1, k + 1, k);
    }
    ruban.geometry.dispose();
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    ruban.geometry = geo;
    ruban.position.set(0, 0, 0);
    ruban.visible = pos.length > 6;
}

// --- Caméra --------------------------------------------------------------------------
// De derrière (3D), à un recul qui grandit avec la vitesse, ou de dessus (2D),
// la route vers le haut de l'écran. Un doigt tourne la vue autour de la
// voiture, deux doigts ou la molette règlent le recul ; huit secondes sans
// geste, elle revient derrière.
// Plus bas qu'à l'origine (70 m de recul sous 30°, 38 m au-dessus de la
// voiture à l'arrêt, 59 m à 130 km/h), à la demande de Yannick, « trop
// haut » : 45 m sous 18°, soit 17 m à l'arrêt et 22 m à 130 km/h.
const RECUL_DEFAUT = 45, PENTE_DEFAUT = 18, HAUTEUR_DEFAUT = 200;
const camVue = { mode: PARAMS.get('vue') === '2d' ? '2d' : '3d', recul: RECUL_DEFAUT, hauteur: HAUTEUR_DEFAUT,
                 lacet: 0, tangage: 0, dernierGeste: -Infinity, cap: 0, cible: new THREE.Vector3() };
const RETOUR_GESTE_S = 8;
// La voiture sous le centre de l'écran, à cette part de sa demi-hauteur :
// vers 71 % de la hauteur depuis le haut, plus bas qu'à l'origine (60 %),
// à la demande de Yannick ; la route devant elle a la place.
const POSITION_VOITURE = 0.42;
const RECUL = [15, 600], HAUTEUR = [60, 3000];
function majCamera(dt, maintenant) {
    const v = voiture;
    if (!v.vue && !v.attendu) return;
    const x = v.vue ? v.x : v.attendu.x, y = v.vue ? v.y : v.attendu.y;
    let alt = v.vue ? v.alt : altitudeL93(x, y);
    if (!Number.isFinite(alt)) alt = camVue.altAttente ?? 0;
    camVue.altAttente = alt;
    if (maintenant - camVue.dernierGeste > RETOUR_GESTE_S * 1000) {
        const k = 1 - Math.exp(-dt / 1.2);
        camVue.lacet -= camVue.lacet * k;
        camVue.tangage -= camVue.tangage * k;
    }
    camVue.cap += ecartCap(v.cap, camVue.cap) * (1 - Math.exp(-dt / 0.6));
    const cap = (camVue.cap + camVue.lacet) * RAD;
    const ux = Math.sin(cap), uy = Math.cos(cap);
    const px = x - ORIGINE.x, pz = ORIGINE.y - y;
    if (camVue.mode === '3d') {
        // Plus loin et plus haut quand on roule vite : on voit venir.
        const recul = camVue.recul * (1 + 0.4 * Math.min(v.v / 36, 1));
        const pente = Math.min(Math.max(PENTE_DEFAUT + camVue.tangage, 4), 80) * RAD;
        const cx = px - ux * recul * Math.cos(pente), cz = pz + uy * recul * Math.cos(pente);
        let cy = alt + recul * Math.sin(pente) + 3;
        const sol = altitudeL93(cx + ORIGINE.x, ORIGINE.y - cz);
        if (Number.isFinite(sol)) cy = Math.max(cy, sol + 6);
        camera.position.set(cx, cy, cz);
        camera.up.set(0, 1, 0);
        // La visée, d'après la place voulue de la voiture à l'écran, et non
        // un point devant elle : elle reste à POSITION_VOITURE quels que
        // soient le recul, la vitesse et l'inclinaison réglée au doigt.
        const versVoiture = Math.atan2(cy - alt - 1, recul * Math.cos(pente));
        const visee = Math.max(versVoiture - Math.atan(POSITION_VOITURE * Math.tan(camera.fov / 2 * RAD)), 2 * RAD);

// La position du soleil à l'heure qu'il est (algorithme de la NOAA, comme la
// page) ; la nuit, une lumière bleutée et un ciel sombre.
function positionSoleil(instant, lat, lon) {
    const jj = instant.getTime() / 86400000 + 2440587.5, t = (jj - 2451545) / 36525;
    const L0 = (280.46646 + t * (36000.76983 + t * 0.0003032)) % 360;
    const M = 357.52911 + t * (35999.05029 - 0.0001537 * t);
    const e = 0.016708634 - t * (0.000042037 + 0.0000001267 * t);
    const centre = Math.sin(M * RAD) * (1.914602 - t * (0.004817 + 0.000014 * t))
                 + Math.sin(2 * M * RAD) * (0.019993 - 0.000101 * t) + Math.sin(3 * M * RAD) * 0.000289;
    const omega = 125.04 - 1934.136 * t;
    const lambda = L0 + centre - 0.00569 - 0.00478 * Math.sin(omega * RAD);
    const eps0 = 23 + (26 + (21.448 - t * (46.815 + t * (0.00059 - t * 0.001813))) / 60) / 60;
    const eps = eps0 + 0.00256 * Math.cos(omega * RAD);
    const decl = Math.asin(Math.sin(eps * RAD) * Math.sin(lambda * RAD)) / RAD;
    const y = Math.tan(eps / 2 * RAD) ** 2;
    const eqTemps = 4 / RAD * (y * Math.sin(2 * L0 * RAD) - 2 * e * Math.sin(M * RAD)
        + 4 * e * y * Math.sin(M * RAD) * Math.cos(2 * L0 * RAD) - 0.5 * y * y * Math.sin(4 * L0 * RAD)
        - 1.25 * e * e * Math.sin(2 * M * RAD));
    const minutes = instant.getUTCHours() * 60 + instant.getUTCMinutes() + instant.getUTCSeconds() / 60;
    const horaire = ((minutes + eqTemps + 4 * lon + 1440) % 1440) / 4 - 180;
    const cosZ = Math.sin(lat * RAD) * Math.sin(decl * RAD) + Math.cos(lat * RAD) * Math.cos(decl * RAD) * Math.cos(horaire * RAD);
    const zenith = Math.acos(Math.min(1, Math.max(-1, cosZ))) / RAD;
    const den = Math.cos(lat * RAD) * Math.sin(zenith * RAD);
    let azimut = 180;
    if (Math.abs(den) > 1e-9) {
        const q = (Math.sin(lat * RAD) * Math.cos(zenith * RAD) - Math.sin(decl * RAD)) / den;
        const a = Math.acos(Math.min(1, Math.max(-1, q))) / RAD;
        azimut = horaire > 0 ? (a + 180) % 360 : (540 - a) % 360;
    }
    return { azimut, hauteur: 90 - zenith };
}
const CIEL = {
    jour: { zenith: new THREE.Color(0x4f86c6), horizon: new THREE.Color(0xbcd0e2), ciel: new THREE.Color(0xdfe8f5) },
    nuit: { zenith: new THREE.Color(0x0b1018), horizon: new THREE.Color(0x1c2430), ciel: new THREE.Color(0x6f80a8) },
};

function majCiel(maintenant) {
    if (maintenant - dernierSoleil < 30000) return;
    dernierSoleil = maintenant;
    const x = voiture.vue ? voiture.x : voiture.attendu?.x, y = voiture.vue ? voiture.y : voiture.attendu?.y;
    if (x == null) return;
    const [lon, lat] = depuisLambert93(x, y);
    const forcee = PARAMS.get('heure');
    const instant = forcee ? new Date(`${new Date().toISOString().slice(0, 10)}T${forcee}`) : new Date();
    const { azimut, hauteur } = positionSoleil(Number.isNaN(instant.getTime()) ? new Date() : instant, lat, lon);

const PETITS_MOTS = new Set(['de', 'du', 'des', 'la', 'le', 'les', 'et', 'en', 'au', 'aux', 'sur', 'sous', 'à']);
// Les abréviations du nom collaboratif (« R DE LA CHAUSSEE D'ANTIN »), quand

const ABREVIATIONS = { r: 'rue', av: 'avenue', ave: 'avenue', bd: 'boulevard', pl: 'place', rte: 'route',
    che: 'chemin', chem: 'chemin', imp: 'impasse', all: 'allée', qu: 'quai', sq: 'square', crs: 'cours',

function nomDeVoie(nom) {
    let brut = String(nom || '').trim();
    if (!brut) return '';
    // Déjà en casse de nom propre (« Rond-point des Champs Elysées-Marcel
    // Dassault ») : tel quel. Seuls les noms tout en capitales (le nom
    // collaboratif) ou tout en minuscules (la BAN, parfois) sont refaits.
    const capitales = brut === brut.toUpperCase();
    if (!capitales && brut !== brut.toLowerCase()) return brut;
    brut = brut.toLowerCase().split(/\s+/).map((m, i) => (i === 0 && capitales && ABREVIATIONS[m]) || m).join(' ');
    const majuscule = mot => mot.split('-')
        .map((p, k) => !p || (k > 0 && PETITS_MOTS.has(p)) ? p : p[0].toUpperCase() + p.slice(1)).join('-');
    return brut.split(' ').map((mot, i) => {
        if (i > 0 && PETITS_MOTS.has(mot)) return mot;

}

// Une voiture virtuelle roule sur le graphe à vitesse constante, tourne au
// hasard aux carrefours (la suite la plus probable deux fois sur trois),
// fait demi-tour au bout d'une impasse, et attend au bord de ce qui n'est
// pas encore lu. Elle donne un relevé par seconde, bruité comme un GPS : la
// page ne sait rien d'autre d'elle.
// --- Itinéraire de la simulation ---------------------------------------------------
// `vers=lat,lon` (et `versnom`, pour l'affichage) : la voiture simulée va
// quelque part, par le plus court chemin du graphe BD TOPO, sens interdits
// respectés, grands axes préférés ; la route prévue devient cet itinéraire,
// jusqu'à l'arrivée. Pour les films et les essais : la page n'a pas de saisie
// de destination. Les carrés d'une bande de ITINERAIRE_BANDE_M autour de la
// droite qui joint départ et arrivée sont lus d'abord.
const VERS = (() => {
    const m = /^\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*$/.exec(PARAMS.get('vers') || '');
    if (!SIMU || !m) return null;
    const [x, y] = versLambert93(Number(m[2]), Number(m[1]));
    return { x, y, nom: PARAMS.get('versnom') || null };

const ITINERAIRE_BANDE_M = 400, ITINERAIRE_CHEMIN_MAX_M = 20000;

// (window.__voiture.partir()) ; un film commence ainsi sur un sol chargé.
let simuPartie = PARAMS.get('attente') !== '1';
// Coût d'un mètre selon l'importance BD TOPO (1 à 6) : les grands axes d'abord.
const POIDS_IMPORTANCE = [1, 1, 1, 1.1, 1.25, 1.5, 2];
let itineraire = null;                   // { etapes: [{ a, sens }], fin: { a, s }, k, longueur }

function tasPousser(tas, e) {
    tas.push(e);
    for (let i = tas.length - 1; i > 0;) {
        const p = (i - 1) >> 1;
        if (tas[p][0] <= tas[i][0]) break;

    }

function tasPrendre(tas) {

    if (tas.length) {
        tas[0] = dernier;
        for (let i = 0; ;) {
            const g = 2 * i + 1, d = g + 1;
            let m = i;
            if (g < tas.length && tas[g][0] < tas[m][0]) m = g;
            if (d < tas.length && tas[d][0] < tas[m][0]) m = d;
            if (m === i) break;
            [tas[m], tas[i]] = [tas[i], tas[m]]; i = m;
        }
    }

/** Les carrés de la bande entre départ et arrivée sont-ils tous lus ? */
function carresItinerairePrets() {
    const d = voiture.attendu, l = Math.hypot(VERS.x - d.x, VERS.y - d.y);
    for (let t = 0; t <= l; t += CARRE_M / 2) {
        const x = d.x + (VERS.x - d.x) * t / l, y = d.y + (VERS.y - d.y) * t / l;
        for (const [ex, ey] of [[0, 0], [ITINERAIRE_BANDE_M, 0], [-ITINERAIRE_BANDE_M, 0], [0, ITINERAIRE_BANDE_M], [0, -ITINERAIRE_BANDE_M]]) {
            const c = carreDe(x + ex, y + ey);
            if (!c || !(c.etat === 'pret' || c.etat === 'hors')) return false;
        }
    }

/** Le plus court chemin, Dijkstra sur les nœuds du graphe ; null s'il n'y en a pas. */
function calculerItineraire() {
    const d = voiture.attendu, depart = caler(d.x, d.y, 40, null), arrivee = caler(VERS.x, VERS.y, 40, null);
    if (!depart || !arrivee) return null;
    const poids = b => (POIDS_IMPORTANCE[b.importance] || 2) * (simu.evitees.has(b) ? 5 : 1);
    const dist = new Map(), prec = new Map(), tas = [];
    const pousser = (n, c, p) => {
        if (c >= (dist.get(n) ?? Infinity)) return;
        dist.set(n, c); prec.set(n, p); tasPousser(tas, [c, n]);
    };

    if (a0.sens !== '-') pousser(a0.n1, (a0.L - depart.s) * poids(a0), { a: a0, sens: 1, de: null });
    if (a0.sens !== '+') pousser(a0.n0, depart.s * poids(a0), { a: a0, sens: -1, de: null });

    while (tas.length) {
        const [c, n] = tasPrendre(tas);
        if (c > (dist.get(n) ?? Infinity)) continue;
        if (meilleur && c >= meilleur.c) break;
        if (n === a2.n0 && a2.sens !== '-') {
            const t = c + arrivee.s * poids(a2);
            if (!meilleur || t < meilleur.c) meilleur = { c: t, n, sens: 1 };
        }
        if (n === a2.n1 && a2.sens !== '+') {
            const t = c + (a2.L - arrivee.s) * poids(a2);
            if (!meilleur || t < meilleur.c) meilleur = { c: t, n, sens: -1 };
        }
        for (const b of n.aretes) {
            if (b.n0 === b.n1 || !permise(b, n)) continue;
            pousser(b.n0 === n ? b.n1 : b.n0, c + b.L * poids(b), { a: b, sens: b.n0 === n ? 1 : -1, de: n });
        }
    }
    if (!meilleur) return null;
    const etapes = [{ a: a2, sens: meilleur.sens }];
    for (let n = meilleur.n; n;) {
        const p = prec.get(n);
        etapes.unshift({ a: p.a, sens: p.sens });
        n = p.de;
    }
    let longueur = 0;
    for (const e of etapes) longueur += e.a.L;
    return { etapes, depart, fin: { a: a2, s: arrivee.s }, k: 0, longueur };
}

const simu = { a: null, s: 0, sens: 1, dernier: -Infinity, etat: { capEntree: null }, v: 0, k: 0, arrive: false,
               // Ce que la voiture simulée ne prend pas : chemins, voies réservées.
               evitees: { has: b => b.nature === 'Chemin' || b.nature === 'Route empierrée'
                                    || !!(b.acces && b.acces.startsWith('Restreint')) } };
function gauss() { return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random()); }
// Avec un itinéraire, la voiture simulée ralentit avant un virage (à 90°,
// au tiers de sa vitesse) et s'arrête à l'arrivée ; sa vitesse suit en une
// seconde.
const VIRAGE_APPROCHE_M = 35, ARRIVEE_APPROCHE_M = 45;
function vitesseVoulueSimu() {
    const vmax = VITESSE_SIMU_KMH / 3.6;
    if (!itineraire || simu.arrive) return simu.arrive ? 0 : vmax;
    const a = simu.a, fin = simu.sens > 0 ? a.L - simu.s : simu.s;
    if (simu.k === itineraire.etapes.length - 1) {
        const reste = Math.abs(itineraire.fin.s - simu.s);
        return vmax * Math.min(Math.max(reste / ARRIVEE_APPROCHE_M, 0.15), 1);
    }
    const suite = itineraire.etapes[simu.k + 1];
    if (!suite || fin > VIRAGE_APPROCHE_M) return vmax;
    const n = simu.sens > 0 ? a.n1 : a.n0;
    const virage = Math.abs(ecartCap(capDepuis(suite.a, n), pointArete(a, simu.sens > 0 ? a.L : 0, simu.sens).cap));
    return vmax * Math.min(Math.max(1 - virage / 120, 0.33), 1);
}

function majSimu(dt, maintenant) {
    if (VERS && !itineraire) {
        // En attendant l'itinéraire, la voiture attend au départ.
        if (maintenant - (simu.essaiItineraire || 0) > 1000 && carresItinerairePrets()) {
            simu.essaiItineraire = maintenant;
            itineraire = calculerItineraire();
            if (itineraire) {
                const e = itineraire.etapes[0];
                simu.a = e.a; simu.sens = e.sens; simu.s = itineraire.depart.s; simu.k = 0;
                voiture.recalculer = true;
            }
        }
        if (!itineraire) {
            if (maintenant - simu.dernier < 1000) return;
            simu.dernier = maintenant;
            const [lon, lat] = depuisLambert93(voiture.attendu.x, voiture.attendu.y);
            recevoirPosition({ coords: { latitude: lat, longitude: lon, accuracy: 5, speed: 0, heading: null } });
            return;
        }
    }
    if (!simu.a) {
        const d = voiture.attendu;
        const m = caler(d.x, d.y, 40, null);
        if (!m) return;
        simu.a = m.a; simu.s = m.s;
        simu.sens = m.a.sens === '-' ? -1 : 1;
    }
    simu.v += ((simuPartie ? vitesseVoulueSimu() : 0) - simu.v) * (1 - Math.exp(-dt / 1.0));
    let reste = simu.v * dt;
    let arrete = simu.arrive;
    for (let garde = 0; reste > 0 && garde < 20 && !simu.arrive; garde++) {
        const a = simu.a;
        if (itineraire && simu.k === itineraire.etapes.length - 1) {
            const jusqua = Math.abs(itineraire.fin.s - simu.s);
            if (reste >= jusqua) { simu.s = itineraire.fin.s; simu.arrive = true; arrete = true; break; }
        }
        const fin = simu.sens > 0 ? a.L - simu.s : simu.s;
        if (reste < fin) { simu.s += simu.sens * reste; reste = 0; break; }
        reste -= fin;
        simu.s = simu.sens > 0 ? a.L : 0;
        const n = simu.sens > 0 ? a.n1 : a.n0;
        if (!carrePret(n.x, n.y)) { arrete = true; break; }
        const choix = itineraire ? itineraire.etapes[++simu.k]
            : suiteProbable(a, simu.sens, n, simu.etat, simu.evitees, HASARD_SIMU);
        if (!choix) {
            if (itineraire) { simu.arrive = true; arrete = true; break; }
            simu.sens = -simu.sens; simu.etat.capEntree = null; continue;
        }
        simu.a = choix.a; simu.sens = choix.sens; simu.s = choix.sens > 0 ? 0 : choix.a.L;
    }
    if (maintenant - simu.dernier < 1000) return;
    simu.dernier = maintenant;
    const p = pointArete(simu.a, simu.s, simu.sens);
    const [lon, lat] = depuisLambert93(p.x + 2.5 * gauss(), p.y + 2.5 * gauss());
    recevoirPosition({ coords: { latitude: lat, longitude: lon, accuracy: 5,
        speed: arrete ? 0 : simu.v, heading: arrete ? null : (p.cap + convergence(lon) + 360) % 360 } });
}

// --- Boucle ---------------------------------------------------------------------------------
function dimensionner() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
    camera.updateProjectionMatrix();
}
window.addEventListener('resize', dimensionner);
dimensionner();

// Une machine lente (l'ancien ordinateur de bord d'une Tesla) : la
// résolution baisse d'un quart tant que l'image dépasse 40 ms en moyenne.
const mesure = { somme: 0, n: 0, debut: performance.now() };
function adapterResolution(dt, maintenant) {
    mesure.somme += dt; mesure.n++;
    if (maintenant - mesure.debut < 3000) return;
    const moyenne = mesure.somme / mesure.n * 1000;
    if (moyenne > 40 && ratio > 1) {
        ratio = Math.max(1, ratio - 0.25);
        renderer.setPixelRatio(ratio);
        dimensionner();
    }
    mesure.somme = 0; mesure.n = 0; mesure.debut = maintenant;
}

let precedent = performance.now();
function boucle(maintenant) {
    requestAnimationFrame(boucle);
    const dt = Math.min((maintenant - precedent) / 1000, 0.1);
    precedent = maintenant;
    if (SIMU && voiture.attendu) majSimu(dt, maintenant);
    majVoiture(dt, maintenant);
    majCamera(dt, maintenant);
    majCarres(maintenant);
    majSol(maintenant);
    majPrecharge(maintenant);
    majManquees(maintenant);
    majRuban(maintenant);
    majCiel(maintenant);
    majHud(maintenant);
    renderer.info.reset();
    renderer.clear();
    renderer.render(scene, camera);
    if (maquette.visible) {
        renderer.clearDepth();
        renderer.render(sceneVoiture, camera);
    }
    adapterResolution(dt, maintenant);
}

// Pour les essais (outils/essai-voiture.mjs) : l'état, en lecture.
const echapperHtml = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
window.__voiture = { voiture, carres, tuilesSol, aretes, camVue, camera, renderer, durees, dureesArbres, statsCache, simu,
                     get itineraire() { return itineraire; }, partir: () => { simuPartie = true; },
                     manquees, statsPrecharge,
                     get budget() { return budgetConstruction; } };

// --- Départ ---------------------------------------------------------------------------------
if (DEPART && Number.isFinite(DEPART.lat)) {
    const [x, y] = versLambert93(DEPART.lon, DEPART.lat);
    voiture.attendu = { x, y };
    recaler(x, y);
    majLienQuitter();
}
if (SIMU) {
    if (!voiture.attendu) {
        accueil('<p>Point de départ illisible.</p>', [['Vue 3D', './', true]]);
    }
} else {
    if (!voiture.attendu) {
        // En attendant la position, la caméra regarde la France d'assez
        // haut ; aucun carré n'y est demandé.
        const [x, y] = versLambert93(2.35, 46.6);
        voiture.attendu = { x, y, provisoire: true };
        recaler(x, y);
        camVue.mode = '2d';
        camVue.hauteur = HAUTEUR[1];
        majBoutonVue();
    }
    demarrerGps();
}
garderEcran();
requestAnimationFrame(boucle);
</script>

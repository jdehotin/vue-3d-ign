<script type="module">
import * as THREE from 'three';

// La vue en voiture : un monde qui défile autour de la position, comme sur un
// GPS. Elle ne lit pas de scène (vue3d/scene.py), trop lente pour la route,
// mais des carrés de 500 m de bâtiments et de routes BD TOPO
// (vue3d/carres.py), chargés le long de la route prévue devant la voiture et
// libérés derrière elle, sur un sol de tuiles d'orthophoto (ou du plan IGN)
// posées sur le RGE ALTI, plus fines près de la caméra.

// --- Paramètres ------------------------------------------------------------
const PARAMS = new URLSearchParams(location.search);
const SIMU = PARAMS.get('simu') === '1';
const nombreParam = (nom, defaut) => {
    const v = Number(PARAMS.get(nom));
    return PARAMS.has(nom) && Number.isFinite(v) ? v : defaut;
};
const VITESSE_SIMU_KMH = Math.min(Math.max(nombreParam('vitesse', 50), 5), 180);
// La part des carrefours où la voiture simulée quitte la route prévue ;
// `hasard=0` : elle la suit, pour un essai qui se rejoue à l'identique.
const HASARD_SIMU = Math.min(Math.max(nombreParam('hasard', 0.33), 0), 1);
// Départ de la simulation sans point : les Champs-Élysées, un lieu public
// où la route est longue et bordée de bâtiments.
const DEPART_SIMU = { lat: 48.8706, lon: 2.3055 };
const DEPART = PARAMS.has('lat') && PARAMS.has('lon')
    ? { lat: nombreParam('lat', NaN), lon: nombreParam('lon', NaN) } : (SIMU ? DEPART_SIMU : null);
if (DEPART && !(Number.isFinite(DEPART.lat) && Number.isFinite(DEPART.lon))) DEPART.lat = DEPART.lon = NaN;
const RAD = Math.PI / 180;

// --- Lambert-93 --------------------------------------------------------------
// Le monde est en Lambert-93 : la projection des carrés (le serveur les lit
// en EPSG:2154), conforme, à moins de 0,1 % d'écart d'échelle sur la France.
// Constantes de l'IGN (ALG0019), comme versLambert93 de index.html et
// vue3d/nuage.py ; un sommet de Gordes rendu par le WFS en EPSG:2154 et en
// EPSG:4326 se retrouve au centième de mètre.
const L93 = { e: 0.0818191910428158, n: 0.7256077650532670, c: 11754255.426096,
              xs: 700000, ys: 12655612.049876, lon0: 3 * RAD };

function versLambert93(lon, lat) {
    const phi = lat * RAD, s = Math.sin(phi);
    const iso = Math.log(Math.tan(Math.PI / 4 + phi / 2) * ((1 - L93.e * s) / (1 + L93.e * s)) ** (L93.e / 2));
    const r = L93.c * Math.exp(-L93.n * iso), g = L93.n * (lon * RAD - L93.lon0);
    return [L93.xs + r * Math.sin(g), L93.ys - r * Math.cos(g)];
}

/** Réciproque : la latitude isométrique, puis la latitude par point fixe. */
function depuisLambert93(x, y) {
    const dx = x - L93.xs, dy = L93.ys - y;
    const r = Math.hypot(dx, dy), g = Math.atan2(dx, dy);
    const iso = -Math.log(r / L93.c) / L93.n;
    let phi = 2 * Math.atan(Math.exp(iso)) - Math.PI / 2;
    for (let k = 0; k < 12; k++) {
        const s = L93.e * Math.sin(phi);
        const suivant = 2 * Math.atan(((1 + s) / (1 - s)) ** (L93.e / 2) * Math.exp(iso)) - Math.PI / 2;
        if (Math.abs(suivant - phi) < 1e-12) { phi = suivant; break; }
        phi = suivant;
    }
    return [(L93.lon0 + g / L93.n) / RAD, phi / RAD];
}

/** Écart du nord du quadrillage au nord vrai, en degrés (convergence des méridiens). */
const convergence = lon => L93.n * (lon - 3);

// --- Monde ---------------------------------------------------------------------
// X = x − ORIGINE.x (vers l'est), Z = ORIGINE.y − y (le nord est −Z), Y =
// l'altitude. L'origine se recale quand la voiture s'en éloigne : les
// sommets d'un objet sont relatifs à son ancre, mais le nuanceur calcule la
// courbure en flottants 32 bits, qu'on garde petits.
const ORIGINE = { x: 0, y: 0 };
const RECALAGE_M = 20000;
const ancres = new Set();
function ancrer(objet, x, y, alt = 0) {
    objet.userData.ancre = [x, y];
    objet.position.set(x - ORIGINE.x, alt, ORIGINE.y - y);
    ancres.add(objet);
}
function recaler(x, y) {
    ORIGINE.x = Math.round(x / 1000) * 1000;
    ORIGINE.y = Math.round(y / 1000) * 1000;
    for (const o of ancres) {
        const [ax, ay] = o.userData.ancre;
        o.position.x = ax - ORIGINE.x;
        o.position.z = ORIGINE.y - ay;
    }
}

// --- Rendu ---------------------------------------------------------------------
const hote = document.getElementById('vue');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.autoClear = false;
renderer.setClearColor(0x0e1116);
// Deux rendus par image (le monde, puis la voiture) : compter les deux.
renderer.info.autoReset = false;
const RATIO_MAX = Math.min(window.devicePixelRatio || 1, 2);
let ratio = RATIO_MAX;
renderer.setPixelRatio(ratio);
hote.appendChild(renderer.domElement);
const ANISOTROPIE = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 1.5, 90000);
// Même brume que l'horizon de la page : rien à 3 km, 15 % à 10 km, 86 % à 35 km.
const brume = new THREE.FogExp2(0xbcd0e2, 4e-5);
scene.fog = brume;
const couleursCiel = { zenith: new THREE.Color(0x4f86c6), horizon: brume.color };
const ciel = new THREE.Mesh(
    new THREE.SphereGeometry(1, 32, 16),
    new THREE.ShaderMaterial({
        uniforms: { zenith: { value: couleursCiel.zenith }, horizon: { value: couleursCiel.horizon } },
        vertexShader: 'varying vec3 vDir;\nvoid main() {\n  vDir = position;\n'
            + '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n}',
        fragmentShader: 'uniform vec3 zenith;\nuniform vec3 horizon;\nvarying vec3 vDir;\nvoid main() {\n'
            + '  gl_FragColor = vec4(mix(horizon, zenith, smoothstep(0.0, 0.45, normalize(vDir).y)), 1.0);\n'
            + '  #include <colorspace_fragment>\n}',
        side: THREE.BackSide, depthWrite: false, fog: false }));
ciel.scale.setScalar(80000);
ciel.renderOrder = -1;
ciel.frustumCulled = false;
scene.add(ciel);

const ambiance = new THREE.HemisphereLight(0xdfe8f5, 0x5a5348, 1.5);
const soleil = new THREE.DirectionalLight(0xfff2dd, 2.0);
scene.add(ambiance, soleil, soleil.target);

// La Terre se courbe sous la caméra : à 50 km, l'horizon descend de 170 m
// (rayon apparent R / (1 − k), k = 0,13, la réfraction, comme l'horizon de
// la page). Ici dans le nuanceur, depuis la caméra qui bouge, et non à la
// construction des tuiles, depuis un centre fixe.
const COURBURE = (1 - 0.13) / (2 * 6371000);
function courber(materiau) {
    materiau.onBeforeCompile = shader => {
        shader.vertexShader = shader.vertexShader.replace('#include <project_vertex>',
            'vec4 mondeP = vec4(transformed, 1.0);\n'
            + '#ifdef USE_INSTANCING\nmondeP = instanceMatrix * mondeP;\n#endif\n'
            + 'mondeP = modelMatrix * mondeP;\n'
            + 'vec2 ecartCam = mondeP.xz - cameraPosition.xz;\n'
            + `mondeP.y -= dot(ecartCam, ecartCam) * ${COURBURE.toExponential(8)};\n`
            + 'vec4 mvPosition = viewMatrix * mondeP;\n'
            + 'gl_Position = projectionMatrix * mvPosition;');
    };
    materiau.customProgramCacheKey = () => 'courbe';
    return materiau;
}

// --- Altitudes -----------------------------------------------------------------
// Les tuiles natives du RGE ALTI (WMTS, pyramide WGS84G, 256 × 256 flottants),
// lues comme l'horizon de la page, et pour les mêmes raisons (le WMS sort en
// gradins et limite à 40 requêtes par seconde). Un trou (−99 999 : la mer,
// l'étranger) vaut 0 m.
const ALTI_URL = (niveau, ligne, colonne) =>
    'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0'
    + '&LAYER=ELEVATION.ELEVATIONGRIDCOVERAGE.HIGHRES&STYLE=normal&FORMAT=image/x-bil;bits=32'
    + `&TILEMATRIXSET=WGS84G_6_14&TILEMATRIX=${niveau}&TILEROW=${ligne}&TILECOL=${colonne}`;
const ALTI_NIVEAU_MIN = 6, ALTI_NIVEAU_MAX = 14;
// Le niveau des tuiles du sol les plus fines (zoom 18 − 5, comme la page :
// un pixel de 9,5 m sur 6,7 m à 45°) : bâtiments, route et voiture s'y posent.
const NIVEAU_PROCHE = 13;
const ALTI_CACHE = 160;                 // 256 Kio chacune
const altis = new Map();                // "niveau/ligne/colonne" → { promesse, valeurs }
function tuileAlti(niveau, ligne, colonne) {
    const cle = `${niveau}/${ligne}/${colonne}`;
    let t = altis.get(cle);
    if (t) return t;
    t = { valeurs: null };
    t.promesse = (async () => {
        const reponse = await lireEnCache(ALTI_URL(niveau, ligne, colonne), DELAI_ALTI_MS);
        if (reponse.status === 404) return new Float32Array(256 * 256).fill(NaN);
        const type = reponse.headers.get('content-type') || '';
// Au large, l'orthophoto de l'IGN n'est pas absente mais blanche : passé le
// bord de la prise de vue, ses tuiles sont d'un blanc pur, entières dès le
// zoom 15 à 7 km au sud de Cassis, coupées en deux au zoom 13, quand le zoom
// 11 y montre la mer bleue. Vue de la route des Crêtes, la mer sortait
// blanche jusqu'à l'horizon. Un texel blanc pur posé au niveau de la mer (le
// RGE ALTI n'y a pas d'altitude : 0 m) prend la teinte de la mer des tuiles
// côtières ; le calcaire blanc des sommets, en altitude, garde la sienne.
const MER = new THREE.Color(0x103448);
function courberSol(materiau) {
    courber(materiau);
    const avant = materiau.onBeforeCompile;
    materiau.onBeforeCompile = shader => {
        avant(shader);
        shader.uniforms.uMer = { value: MER };
        shader.vertexShader = shader.vertexShader
            .replace('#include <common>', '#include <common>\nvarying float vAltSol;')
            .replace('#include <begin_vertex>', '#include <begin_vertex>\nvAltSol = position.y;');
        shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>', '#include <common>\nvarying float vAltSol;\nuniform vec3 uMer;')
            .replace('#include <map_fragment>', '#include <map_fragment>\n#ifdef USE_MAP\n'
                + 'if (vAltSol < 1.5 && min(min(sampledDiffuseColor.r, sampledDiffuseColor.g), sampledDiffuseColor.b) > 0.96)'
                + ' diffuseColor.rgb = diffuse * uMer;\n#endif');
    };
    materiau.customProgramCacheKey = () => 'courbe-sol';
    return materiau;
}

        if (!reponse.ok || !type.startsWith('image/x-bil')) throw new Error(`RGE ALTI : ${reponse.status} ${type}`);
        const v = new Float32Array(await reponse.arrayBuffer());
        if (v.length !== 256 * 256) throw new Error('RGE ALTI tronqué');
        for (let i = 0; i < v.length; i++) if (v[i] < -100) v[i] = NaN;
        return v;
    })().then(v => { t.valeurs = v; return v; },
              e => { if (altis.get(cle) === t) altis.delete(cle); throw e; });
    t.promesse.catch(() => {});
    altis.set(cle, t);
    if (altis.size > ALTI_CACHE) {
        // Les plus anciennes déjà lues : celles qu'on attend restent.
        for (const [k, v] of altis) {
            if (altis.size <= ALTI_CACHE) break;
            if (v.valeurs) altis.delete(k);
        }
    }
    return t;
}
const pasAlti = niveau => 180 / 2 ** niveau / 256;

/** Les tuiles d'altitude qui couvrent une emprise en degrés, lues. */
function preparerAltitudes(o, s, e, n, niveau) {
    const p = pasAlti(niveau);
    const c0 = Math.floor(((o + 180) / p - 1) / 256), c1 = Math.floor(((e + 180) / p + 1) / 256);
    const l0 = Math.floor(((90 - n) / p - 1) / 256), l1 = Math.floor(((90 - s) / p + 1) / 256);
    const attentes = [];
    for (let l = l0; l <= l1; l++) for (let c = c0; c <= c1; c++) attentes.push(tuileAlti(niveau, l, c).promesse);
    return Promise.all(attentes);
}

let derniereAlti = { cle: null, valeurs: null };
function pixelAlti(niveau, i, j) {
    const cle = `${niveau}/${j >> 8}/${i >> 8}`;
    let valeurs = derniereAlti.cle === cle ? derniereAlti.valeurs : null;
    if (!valeurs) {
        const t = altis.get(cle);
        if (!t || !t.valeurs) return NaN;
        valeurs = t.valeurs;
        derniereAlti = { cle, valeurs };
    }
    const v = valeurs[(j & 255) * 256 + (i & 255)];
    return Number.isNaN(v) ? 0 : v;
}

/** Altitude bilinéaire, centres des pixels aux demi-entiers ; NaN tant que la tuile n'est pas lue. */
function altitude(lon, lat, niveau = NIVEAU_PROCHE) {
    const p = pasAlti(niveau);
    const fx = (lon + 180) / p - 0.5, fy = (90 - lat) / p - 0.5;
    const i = Math.floor(fx), j = Math.floor(fy), ax = fx - i, ay = fy - j;
    return (pixelAlti(niveau, i, j) * (1 - ax) + pixelAlti(niveau, i + 1, j) * ax) * (1 - ay)
         + (pixelAlti(niveau, i, j + 1) * (1 - ax) + pixelAlti(niveau, i + 1, j + 1) * ax) * ay;
}
const altitudeL93 = (x, y) => altitude(...depuisLambert93(x, y));

// --- Sol en tuiles ---------------------------------------------------------------
// L'horizon de la page, repris pour un monde qui défile : des tuiles WMTS
// (Web Mercator) de l'orthophoto ou du plan, d'autant plus fines qu'elles
// sont près de la caméra, et grossières hors du champ ; une tuile ne cède sa
// place qu'une fois ses quatre enfants prêts. Une caméra fantôme, là où
// sera la voiture dans quelques secondes, demande d'avance celles qu'elle y
// verra.
const SOL_ZOOM_MIN = 9;          // celui du serveur (tuiles.TUILES_ZOOM)
const SOL_ZOOM_MAX = 18;         // ~150 m de côté, 0,6 m par pixel
const SOL_MAILLES = 32;
const SOL_RAYON = 40000;
const SOL_FINESSE = 1.5;
const SOL_HORS_CHAMP = 4;
const SOL_PARALLELE = 10;
const SOL_CACHE = 360;           // ~340 Ko de texture chacune sur le GPU
const ANTICIPATION_S = [6, 12];  // la caméra fantôme : où sera la voiture
const FONDS = {
    ortho: (z, x, y) => `api/tuile/ortho/${z}/${x}/${y}`,
    plan: (z, x, y) => `api/tuile/plan/${z}/${x}/${y}`,
};
let fond = PARAMS.get('fond') === 'plan' ? 'plan' : 'ortho';
let generationFond = 0;
const tuilesSol = new Map();
let solEnVol = 0;
let derniereSelectionSol = -Infinity;
const groupeSol = new THREE.Group();
scene.add(groupeSol);
const COULEUR_SOL = new THREE.Color(0x8b8f87);
// La teinte posée sur l'image des tuiles : blanche le jour, bleu sombre la nuit.
const teinteSol = new THREE.Color(0xffffff), TEINTE_SOL_NUIT = new THREE.Color(0x56627e);

const versTuile = (lon, lat, z) => {
    const n = 2 ** z, r = lat * RAD;
    return [Math.floor((lon + 180) / 360 * n),
            Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)];
};
const versLonLat = (x, y, z) => {
    const n = 2 ** z;
    return [x / n * 360 - 180, Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) / RAD];
};

// En voiture, une image peut ne jamais répondre (une zone sans réseau) : elle
// tenait une des SOL_PARALLELE places pour toujours. Abandonnée au bout de
// ce délai, elle sera redemandée.
const DELAI_IMAGE_MS = 10000, DELAI_ALTI_MS = 15000;
function chargerImage(url, delai = DELAI_IMAGE_MS) {
    return new Promise((ok, ko) => {
        const img = new Image();
        const minuterie = setTimeout(() => { img.src = ''; ko(new Error(`image trop lente : ${url}`)); }, delai);
        img.crossOrigin = 'anonymous';
        img.onload = () => { clearTimeout(minuterie); ok(img); };
        img.onerror = e => { clearTimeout(minuterie); ko(e); };
        img.src = url;
    });
}
/** Une lecture qui ne répond pas dans le délai est abandonnée. */
async function lireAvecDelai(url, delai) {
    const arret = new AbortController();
    const minuterie = setTimeout(() => arret.abort(), delai);
    try { return await fetch(url, { signal: arret.signal }); }
    finally { clearTimeout(minuterie); }
}
/** L'IGN n'a pas de photo ici, le serveur le confirme (404) : un fait, pas une panne. */
class TuileAbsente extends Error {}

// --- Les tuiles gardées dans la voiture ---------------------------------------------
// Les tuiles de l'IGN (photo, plan, altitudes) n'ont aucun en-tête de cache
// (vérifié le 2026-10-20) : le navigateur les relisait à chaque trajet, sur
// le réseau mobile, et le serveur ne peut pas les relayer sans y user ses
// fils (l'IGN mettait ce jour-là de 0,3 à 6,7 s par tuile). La page les
// range elle-même dans le stockage du navigateur (Cache Storage, permanent
// en https) : un trajet refait se charge de là, même sans réseau. Au plus
// CACHE_TUILES_MAX tuiles (une photo ~20 Ko, une tuile d'altitude ~210 Ko :
// quelques centaines de mégaoctets), les plus anciennes rendues d'abord ; un
// cache par trimestre, l'ancien effacé, comme le stock du serveur qui purge à
// 90 jours : une nouvelle prise de vue de l'IGN arrive dans la voiture.
const CACHE_PREFIXE = 'vue3d-voiture-tuiles-';
const CACHE_TUILES_MAX = 15000, CACHE_PURGE_TOUTES = 400;
const statsCache = { lues: 0, gardees: 0, reseau: 0 };
let ecrituresCache = 0;
const ouvertureCache = (async () => {
    try {
        if (!window.caches) return null;
        const d = new Date(), nom = `${CACHE_PREFIXE}${d.getFullYear()}T${Math.floor(d.getMonth() / 3) + 1}`;
        for (const autre of await caches.keys()) if (autre.startsWith(CACHE_PREFIXE) && autre !== nom) caches.delete(autre);
        // Que le navigateur ne l'efface pas de lui-même quand il manque de place.
        navigator.storage?.persist?.().catch(() => {});
        return await caches.open(nom);
    } catch (e) { return null; }        // navigation privée, stockage refusé : sans cache
})();

function garderEnCache(cache, url, reponse) {
    cache.put(url, reponse).then(async () => {
        statsCache.gardees++;
        if (++ecrituresCache % CACHE_PURGE_TOUTES) return;
        const cles = await cache.keys();
        for (const c of cles.slice(0, Math.max(cles.length - Math.floor(CACHE_TUILES_MAX * 0.9), 0))) await cache.delete(c);
    }).catch(() => {});
}

/** La réponse de `url`, du cache de la voiture, sinon du réseau (gardée si elle est bonne). */
async function lireEnCache(url, delai, noter = true) {
    const cache = await ouvertureCache;
    if (cache) {
        try {
            const r = await cache.match(url);
            if (r) { statsCache.lues++; return r; }
        } catch (e) { /* cache illisible : le réseau */ }
    }
    let r;
    try { r = await lireAvecDelai(url, delai); }
    catch (e) { if (noter) noterManquee(url); throw e; }
    statsCache.reseau++;
    if (r.ok) {
        oublierManquee(url);
        if (cache) garderEnCache(cache, url, r.clone());
    } else if (noter && (r.status >= 500 || r.status === 429)) {
        noterManquee(url);
    }
    return r;
}

// --- Les tuiles manquées, redemandées plus tard ------------------------------------
// Une tuile qui n'a pas pu se charger (pas de réseau, IGN en panne) est
// notée, avec le nombre de fois où la page l'a demandée, et gardée d'une
// session à l'autre (localStorage) : elle est redemandée en arrière-plan, les
// plus demandées d'abord — celles d'un trajet habituel —, de plus en plus
// tard (30 s, puis jusqu'à 10 min), quand le sol visible laisse de la place ;
// arrivée, elle entre au cache et sort de la liste. Une absence confirmée par
// l'IGN l'en retire aussi.
const MANQUEES_CLE = 'vue3d-voiture-manquees', MANQUEES_MAX = 2000, MANQUEES_PARALLELE = 2;
const MANQUEES_ATTENTE_MS = 30000, MANQUEES_ATTENTE_MAX_MS = 600000;
const manquees = new Map();            // url → { n : demandes, prochain : instant, essais }
try {
    for (const [url, n] of JSON.parse(localStorage.getItem(MANQUEES_CLE) || '[]')) {
        if (typeof url === 'string' && Number.isFinite(n)) manquees.set(url, { n, prochain: 0, essais: 0 });
    }
} catch (e) { /* stockage refusé ou illisible : une liste neuve */ }
let manqueesModifiees = false, manqueesEnVol = 0, dernierManquees = -Infinity, derniereSauvegarde = -Infinity;
function noterManquee(url) {
    const m = manquees.get(url) || { n: 0, prochain: 0, essais: 0 };
    m.n++;
    if (m.prochain !== Infinity) m.prochain = performance.now() + MANQUEES_ATTENTE_MS;
    manquees.set(url, m);
    manqueesModifiees = true;
    if (manquees.size > MANQUEES_MAX) {
        // Trop de tuiles en attente : les moins demandées s'en vont.
        const moindre = [...manquees].reduce((a, b) => (b[1].n < a[1].n ? b : a));
        manquees.delete(moindre[0]);
    }
}
function oublierManquee(url) { if (manquees.delete(url)) manqueesModifiees = true; }
function sauverManquees() {
    if (!manqueesModifiees) return;
    try {
        localStorage.setItem(MANQUEES_CLE, JSON.stringify([...manquees].map(([u, m]) => [u, m.n])));
        manqueesModifiees = false;
    } catch (e) { /* stockage refusé : la liste vit le temps de la page */ }
}
window.addEventListener('pagehide', sauverManquees);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') sauverManquees(); });

async function reessayerManquee(url, m) {
    try {
        let r = await lireEnCache(url, url.startsWith('api/tuile') ? DELAI_IMAGE_MS : DELAI_ALTI_MS, false);
        if (r.ok) return;                                   // gardée, oubliée par lireEnCache
        if (r.status === 404) {
            // Une photo refusée à l'IGN : le serveur la relit, ou confirme
            // qu'elle n'existe pas ; une altitude absente, c'est la mer.
            if (url.startsWith('api/tuile')) await relireTuile(url);
            oublierManquee(url);
            return;
        }
        throw new Error(`HTTP ${r.status}`);
    } catch (e) {
        if (e instanceof TuileAbsente) { oublierManquee(url); return; }
        m.essais++;
        m.prochain = performance.now() + Math.min(MANQUEES_ATTENTE_MS * 2 ** m.essais, MANQUEES_ATTENTE_MAX_MS);
    }
}

function majManquees(maintenant) {
    if (maintenant - derniereSauvegarde > 15000) { derniereSauvegarde = maintenant; sauverManquees(); }
    if (maintenant - dernierManquees < 2000 || !manquees.size) return;
    dernierManquees = maintenant;
    // Le sol visible d'abord.
    if (solEnVol >= SOL_PARALLELE / 2) return;
    const pretes = [...manquees].filter(([, m]) => m.prochain <= maintenant).sort((a, b) => b[1].n - a[1].n);
    for (const [url, m] of pretes) {
        if (manqueesEnVol >= MANQUEES_PARALLELE) break;
        manqueesEnVol++;
        m.prochain = Infinity;                              // en cours
        reessayerManquee(url, m).finally(() => {
            manqueesEnVol--;
            if (m.prochain === Infinity) m.prochain = performance.now() + MANQUEES_ATTENTE_MS;
        });
    }
}

// --- Le préchargement le long de la route ---------------------------------------
// La page ne demande le sol que là où sont la caméra et, d'avance, la voiture
// dans 6 et 12 s : une zone sans réseau traversée pour la première fois
// gardait ses bâtiments, lus 2 à 6 km devant, sur une photo floue. Les photos
// fines (zooms 16 à 18) et les altitudes d'une bande de PRECHARGE_LARGEUR_M
// de part et d'autre de la route prévue, sur PRECHARGE_M devant, entrent au
// cache sans être dessinées, trois à la fois, à part du sol visible :
// n'avançant que quand celui-ci laissait une place, elles prenaient du retard
// dès que l'IGN ralentissait (aucune tuile nette au bout d'une minute de
// coupure à 110 km/h, une fois sur deux).
const PRECHARGE_M = 2000, PRECHARGE_PAS_M = 75, PRECHARGE_LARGEUR_M = 120, PRECHARGE_PARALLELE = 3;
const PRECHARGE_ZOOMS = [16, 17, 18];
const prechargees = new Set();
const statsPrecharge = { demandees: 0, deja: 0 };
let prechargesEnVol = 0, dernierePrecharge = -Infinity;

function majPrecharge(maintenant) {
    if (maintenant - dernierePrecharge < 300) return;
    dernierePrecharge = maintenant;
    const ch = voiture.chemin;
    let libres = PRECHARGE_PARALLELE - prechargesEnVol;
    if (!ch || !voiture.vue || libres <= 0) return;
    const lancer = url => {
        if (libres <= 0 || prechargees.has(url)) return;
        prechargees.add(url);
        libres--;
        prechargesEnVol++;
        precharger(url).finally(() => { prechargesEnVol--; });
    };
    // Du plus près au plus loin : la route d'abord, puis ses deux bords.
    const fin = Math.min(voiture.dChemin + PRECHARGE_M, ch.longueur);
    for (let d = voiture.dChemin; d <= fin && libres > 0; d += PRECHARGE_PAS_M) {
        const p = pointDuChemin(ch, d);
        const nx = Math.cos(p.cap * RAD) * PRECHARGE_LARGEUR_M, ny = -Math.sin(p.cap * RAD) * PRECHARGE_LARGEUR_M;
        for (const k of [0, -1, 1]) {
            const [lon, lat] = depuisLambert93(p.x + nx * k, p.y + ny * k);
            for (const z of PRECHARGE_ZOOMS) {
                const [tx, ty] = versTuile(lon, lat, z);
                lancer(FONDS[fond](z, tx, ty));
                const niveau = Math.min(Math.max(z - 5, ALTI_NIVEAU_MIN), ALTI_NIVEAU_MAX), q = pasAlti(niveau) * 256;
                lancer(ALTI_URL(niveau, Math.floor((90 - lat) / q), Math.floor((lon + 180) / q)));
            }
        }
    }
}

async function precharger(url) {
    const cache = await ouvertureCache;
    if (!cache) return;                                      // sans cache, rien à gagner
    try {
        if (await cache.match(url)) { statsPrecharge.deja++; return; }
        statsPrecharge.demandees++;
        await lireEnCache(url, url.startsWith('api/tuile') ? DELAI_IMAGE_MS : DELAI_ALTI_MS);
    } catch (e) { /* notée, redemandée plus tard */ }
}

/** L'image d'une tuile, du cache ou du réseau ; lève si elle ne vient pas. */
async function imageEnCache(url) {
    const r = await lireEnCache(url, DELAI_IMAGE_MS);
    if (!r.ok) throw new Error(`tuile ${r.status} : ${url}`);
    const lien = URL.createObjectURL(await r.blob());
    try { return await chargerImage(lien); } finally { URL.revokeObjectURL(lien); }
}

// Une tuile refusée au navigateur est relue par le serveur, qui la garde
// (vue3d/tuiles.py) : l'IGN en refuse de loin en loin une qui existe. Deux à
// la fois, comme la page.
const RELECTURES_SIMULTANEES = 2;
let relecturesEnCours = 0;
const relecturesEnAttente = [];
async function relireTuile(url) {
    if (relecturesEnCours >= RELECTURES_SIMULTANEES) await new Promise(r => relecturesEnAttente.push(r));
    relecturesEnCours++;
    try {
        for (let essai = 0; essai < 3; essai++) {
            const reponse = await lireAvecDelai(`${url}?relire=1`, DELAI_IMAGE_MS);
            if (reponse.ok) {
                // Gardée sous l'adresse de la tuile : le prochain trajet l'y trouve.
                const cache = await ouvertureCache;
                if (cache) garderEnCache(cache, url, reponse.clone());
                const lien = URL.createObjectURL(await reponse.blob());
                try { return await chargerImage(lien); } finally { URL.revokeObjectURL(lien); }
            }
            if (reponse.status === 404) throw new TuileAbsente(url);
            if (reponse.status !== 503) break;
            await new Promise(r => setTimeout(r, (Number(reponse.headers.get('retry-after')) || 2) * 1000));
        }
        throw new Error(`tuile non relue : ${url}`);
    } finally {
        relecturesEnCours--;
        relecturesEnAttente.shift()?.();
    }
}

const parentSol = t => t.z > SOL_ZOOM_MIN ? tuilesSol.get(`${t.z - 1}/${t.x >> 1}/${t.y >> 1}`) : undefined;

function tuileSol(z, x, y) {
    const cle = `${z}/${x}/${y}`;
    let t = tuilesSol.get(cle);
    if (t) return t;
    const [o, n] = versLonLat(x, y, z), [e, s] = versLonLat(x + 1, y + 1, z);
    const coins = [versLambert93(o, n), versLambert93(e, n), versLambert93(o, s), versLambert93(e, s)];
    const xs = coins.map(c => c[0]), ys = coins.map(c => c[1]);
    const p = parentSol({ z, x, y });
    t = { z, x, y, cle, o, e, s, n,
          minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys),
          image: null, sansImage: -1, fondGen: -1, mesh: null, enCours: false, reessai: 0, vue: 0,
          ymin: p ? p.ymin : 0, ymax: p ? p.ymax : 0 };
    t.cx = (t.minX + t.maxX) / 2; t.cy = (t.minY + t.maxY) / 2; t.largeur = t.maxX - t.minX;
    tuilesSol.set(cle, t);
    return t;
}

/**
 * L'image d'une tuile ; null si l'IGN n'en a pas (404 confirmé) ; une panne
 * (réseau coupé, serveur occupé, délai) lève, et la tuile sera redemandée.
 *
 * Seule l'absence confirmée vaut absence. La page classait « sans image » toute
 * tuile dont la relecture échouait, et ses descendantes ne demandaient plus
 * rien : une zone sans réseau, ou un épisode de 404 de l'IGN (une tuile du
 * zoom 15 au centre de Rousset, puis 200 cinq fois de suite) où le serveur,
 * qui relit deux tuiles à la fois, répondait 503, laissaient toute une zone
 * grise pour la vie de la page — 274 tuiles montrées sur 274 après 15 s de
 * coupure et 35 s de réseau. Sous un ancêtre sans image (la mer, l'étranger),
 * une descendante essaie encore l'IGN, sans relecture : l'image peut exister
 * plus fin.
 */
async function imageSol(t, gen) {
    let ancetreAbsent = false;
    for (let a = parentSol(t); a; a = parentSol(a)) if (a.sansImage === gen) { ancetreAbsent = true; break; }
    const url = FONDS[fond](t.z, t.x, t.y);
    try { return await imageEnCache(url); }
    catch (e) {
        if (ancetreAbsent) { t.sansImage = gen; return null; }
        try { return await relireTuile(url); }
        catch (e2) {
            if (e2 instanceof TuileAbsente) { t.sansImage = gen; oublierManquee(url); return null; }
            noterManquee(url);
            throw e2;
        }
    }
}

function habillerTuile(t) {
    const m = t.mesh.material;
    if (m.map) { m.map.dispose(); m.map = null; }
    let a = t;
    while (a && !(a.fondGen === generationFond && a.image)) a = parentSol(a);
    if (a) {
        const tex = new THREE.Texture(a.image);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = ANISOTROPIE;
        if (a !== t) {
            const k = 2 ** (t.z - a.z), ix = t.x - a.x * k, iy = t.y - a.y * k;
            tex.repeat.set(1 / k, 1 / k);
            tex.offset.set(ix / k, (k - iy - 1) / k);
        }
        tex.needsUpdate = true;
        m.map = tex;
        m.color.copy(teinteSol);
    } else {
        m.color.copy(COULEUR_SOL);
    }
    m.needsUpdate = true;
}

/**
 * Le maillage d'une tuile, sommets relatifs à son centre : altitudes au
 * niveau z − 5 de la pyramide, normales par différences centrées d'une
 * maille (deux voisines ont la même au bord), et une jupe pendue sous chaque
 * bord, qui bouche la fente avec une voisine d'un autre zoom.
 */
function construireTuile(t, niveau) {
    const N = SOL_MAILLES, L = N + 1, nb = L * L;
    const dLon = (t.e - t.o) / N;
    const pos = new Float32Array((nb + 4 * L) * 3), nor = new Float32Array((nb + 4 * L) * 3);
    const uv = new Float32Array((nb + 4 * L) * 2);
    let ymin = Infinity, ymax = -Infinity;
    for (let j = 0; j < L; j++) {
        for (let i = 0; i < L; i++) {
            const k = j * L + i;
            const [lon, lat] = versLonLat(t.x + i / N, t.y + j / N, t.z);
            const [x, y] = versLambert93(lon, lat);
            const a = altitude(lon, lat, niveau) || 0;
            const dLat = dLon * Math.cos(lat * RAD);
            const mx = 2 * dLon * 111320 * Math.cos(lat * RAD), my = 2 * dLat * 111320;
            const gE = ((altitude(lon + dLon, lat, niveau) || 0) - (altitude(lon - dLon, lat, niveau) || 0)) / mx;
            const gN = ((altitude(lon, lat + dLat, niveau) || 0) - (altitude(lon, lat - dLat, niveau) || 0)) / my;
            const l = Math.hypot(gE, 1, gN);
            pos[3 * k] = x - t.cx; pos[3 * k + 1] = a; pos[3 * k + 2] = t.cy - y;
            nor[3 * k] = -gE / l; nor[3 * k + 1] = 1 / l; nor[3 * k + 2] = gN / l;
            uv[2 * k] = i / N; uv[2 * k + 1] = 1 - j / N;
            ymin = Math.min(ymin, a); ymax = Math.max(ymax, a);
        }
    }
    const bords = [];
    for (let i = 0; i < L; i++) bords.push(i);
    for (let j = 0; j < L; j++) bords.push(j * L + N);
    for (let i = N; i >= 0; i--) bords.push(N * L + i);
    for (let j = N; j >= 0; j--) bords.push(j * L);
    const jupe = 5 + 0.5 * t.largeur / N;
    for (let b = 0; b < bords.length; b++) {
        const k = bords[b], q = nb + b;
        pos[3 * q] = pos[3 * k]; pos[3 * q + 1] = pos[3 * k + 1] - jupe; pos[3 * q + 2] = pos[3 * k + 2];
        nor[3 * q] = nor[3 * k]; nor[3 * q + 1] = nor[3 * k + 1]; nor[3 * q + 2] = nor[3 * k + 2];
        uv[2 * q] = uv[2 * k]; uv[2 * q + 1] = uv[2 * k + 1];
    }
    const index = [];
    for (let j = 0; j < N; j++) {
        for (let i = 0; i < N; i++) {
            const a = j * L + i, c = a + L;
            index.push(a, c, a + 1, c, c + 1, a + 1);
        }
    }
    for (let c = 0; c < 4; c++) {
        for (let k = 0; k < N; k++) {
            const b = c * L + k, e0 = bords[b], e1 = bords[b + 1], s0 = nb + b, s1 = s0 + 1;
            index.push(e0, e1, s0, s0, e1, s1);
        }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(index);
    geo.computeBoundingSphere();
    t.mesh = new THREE.Mesh(geo, courberSol(new THREE.MeshLambertMaterial({ color: COULEUR_SOL })));
    t.mesh.visible = false;
    t.ymin = ymin; t.ymax = ymax;
    ancrer(t.mesh, t.cx, t.cy);
    habillerTuile(t);
    groupeSol.add(t.mesh);
}

async function chargerTuileSol(t) {
    t.enCours = true;
    solEnVol++;
    const gen = generationFond;
    const niveau = Math.min(Math.max(t.z - 5, ALTI_NIVEAU_MIN), ALTI_NIVEAU_MAX);
    try {
        const marge = (t.e - t.o) / SOL_MAILLES * 1.5;
        const [, image] = await Promise.all([
            t.mesh ? null : preparerAltitudes(t.o - marge, t.s - marge, t.e + marge, t.n + marge, niveau),
            t.fondGen === gen ? t.image : imageSol(t, gen)]);
        if (gen === generationFond) { t.image = image; t.fondGen = gen; }
        if (!tuilesSol.has(t.cle)) return;
        if (!t.mesh) construireTuile(t, niveau);
        else habillerTuile(t);
        t.echecs = 0;
    } catch (e) {
        // Altitudes ou image en panne : redemandée de plus en plus tard, de
        // 4 à 20 s, pas plus : le réseau revenu, le sol doit suivre ; d'ici
        // là, sa mère la couvre.
        t.echecs = (t.echecs || 0) + 1;
        t.reessai = performance.now() + Math.min(4000 * 2 ** (t.echecs - 1), 20000);
    } finally {
        t.enCours = false;
        solEnVol--;
    }
}

const champ = new THREE.Frustum(), boite = new THREE.Box3(), matriceChamp = new THREE.Matrix4();

/**
 * Parcourt l'arbre des tuiles depuis `t` pour un point de vue `pv` ({x, y}
 * Lambert-93, h altitude, regard(t) → 1 dans le champ, SOL_HORS_CHAMP
 * hors). Rend vrai si la tuile est couverte ; `liste` reçoit les tuiles à
 * montrer (null pour la caméra fantôme), `voulues` celles à charger.
 */
function couvrirSol(t, pv, liste, voulues, maintenant, dMere = 0) {
    if (liste) t.vue = maintenant;
    const dx = Math.max(t.minX - pv.x, 0, pv.x - t.maxX);
    const dy = Math.max(t.minY - pv.y, 0, pv.y - t.maxY);
    if (Math.hypot(dx, dy) > SOL_RAYON) return true;
    const dh = Math.max(t.ymin - pv.h, 0, pv.h - t.ymax);
    const d = Math.hypot(dx, dy, dh), facteur = pv.regard(t);
    if (t.z < SOL_ZOOM_MAX && facteur * d < SOL_FINESSE * t.largeur) {
        const sous = [];
        let pretes = true;
        for (let k = 0; k < 4; k++) {
            const enfant = tuileSol(t.z + 1, 2 * t.x + (k & 1), 2 * t.y + (k >> 1));
            if (!couvrirSol(enfant, pv, liste && sous, voulues, maintenant, facteur * d)) pretes = false;
        }
        if (pretes) { if (liste) liste.push(...sous); return true; }
    }
    // Priorité : la distance de la mère, rapportée à la taille de la tuile.
    // Les quatre sœurs, qui ne remplacent leur mère qu'ensemble, l'ont la
    // même ; les découpes près de la caméra passent avant celles de
    // l'horizon, les racines avant tout. Dans l'ordre du zoom, comme
    // l'horizon de la page, les tuiles du zoom 18 sous la voiture attendaient
    // derrière toutes celles de l'horizon : aucune après 15 s à 130 km/h sur
    // l'A7, le sol gris, quand la caméra basse a regardé plus loin.
    if (!t.enCours && (!t.mesh || t.fondGen !== generationFond) && maintenant >= t.reessai) {
        voulues.push({ t, d, p: dMere / t.largeur });
    }
    if (t.mesh) { if (liste) liste.push(t); return true; }
    return false;
}

function racinesSol(x, y) {
    const [lon, lat] = depuisLambert93(x, y);
    const dLat = SOL_RAYON / 111320, dLon = dLat / Math.cos(lat * RAD);
    const [x0, y0] = versTuile(lon - dLon, lat + dLat, SOL_ZOOM_MIN);
    const [x1, y1] = versTuile(lon + dLon, lat - dLat, SOL_ZOOM_MIN);
    const r = [];
    for (let tx = x0; tx <= x1; tx++) for (let ty = y0; ty <= y1; ty++) r.push(tuileSol(SOL_ZOOM_MIN, tx, ty));
    return r;
}

function majSol(maintenant) {
    groupeSol.visible = !voiture.attendu?.provisoire || voiture.vue;
    if (!groupeSol.visible || maintenant - derniereSelectionSol < 100) return;
    derniereSelectionSol = maintenant;
    camera.updateMatrixWorld();
    champ.setFromProjectionMatrix(matriceChamp.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
    const cam = { x: camera.position.x + ORIGINE.x, y: ORIGINE.y - camera.position.z, h: camera.position.y,
        regard: t => {
            const m = t.largeur / 2;
            boite.min.set(t.minX - ORIGINE.x - m, t.ymin - m, ORIGINE.y - t.maxY - m);
            boite.max.set(t.maxX - ORIGINE.x + m, t.ymax + m, ORIGINE.y - t.minY + m);
            return champ.intersectsBox(boite) ? 1 : SOL_HORS_CHAMP;
        } };
    const liste = [], voulues = [];
    for (const r of racinesSol(cam.x, cam.y)) couvrirSol(r, cam, liste, voulues, maintenant);
    const montrees = new Set(liste);
    for (const t of tuilesSol.values()) if (t.mesh) t.mesh.visible = montrees.has(t);
    voulues.sort((a, b) => a.p - b.p);

    // La caméra fantôme : là où la voiture sera, regardant devant elle.
    const devant = [];
    if (voiture.vue && voiture.v > 3 && voiture.chemin) {
        for (const s of ANTICIPATION_S) {
            const p = pointDuChemin(voiture.chemin, voiture.dChemin + voiture.v * s);
            if (!p) continue;
            const ux = Math.sin(p.cap * RAD), uy = Math.cos(p.cap * RAD);
            const pv = { x: p.x, y: p.y, h: voiture.alt + 40,
                regard: t => ((t.cx - p.x) * ux + (t.cy - p.y) * uy > -t.largeur ? 1 : SOL_HORS_CHAMP) };
            for (const r of racinesSol(p.x, p.y)) couvrirSol(r, pv, null, devant, maintenant);
        }
        devant.sort((a, b) => a.p - b.p);
    }
    for (const { t } of [...voulues, ...devant]) {
        if (solEnVol >= SOL_PARALLELE) break;
        if (!t.enCours) chargerTuileSol(t);
    }

    if (tuilesSol.size > SOL_CACHE) {
        // Jamais les ancêtres d'une tuile montrée : leur image habille celles
        // qui n'ont pas encore la leur. Évincés, ils laissaient le sol gris.
        const ancetres = new Set();
        for (const t of montrees) for (let a = parentSol(t); a && !ancetres.has(a); a = parentSol(a)) ancetres.add(a);
        const vieilles = [...tuilesSol.values()]
            .filter(t => !montrees.has(t) && !ancetres.has(t) && !t.enCours && t.vue < maintenant)
            .sort((a, b) => a.vue - b.vue)
            .slice(0, tuilesSol.size - SOL_CACHE);
        for (const t of vieilles) {
            if (t.mesh) {
                groupeSol.remove(t.mesh);
                ancres.delete(t.mesh);
                t.mesh.geometry.dispose();
                t.mesh.material.map?.dispose();
                t.mesh.material.dispose();
            }
            tuilesSol.delete(t.cle);
        }
    }
}

function changerFond(nom) {
    fond = nom;
    generationFond++;
    for (const t of tuilesSol.values()) { t.image = null; t.fondGen = -1; }
    derniereSelectionSol = -Infinity;
    document.getElementById('b-fond').textContent = fond === 'ortho' ? 'Plan' : 'Photo';
    montrerRoutesAuSol();
}

// --- Carrés : bâtiments et routes ------------------------------------------------
// Demandés le long de la route prévue, sur une bande de COULOIR_M de part et
// d'autre, et dans un rayon AUTOUR_M de la voiture ; montrés tant qu'ils
// sont voulus, défaits CARRE_DEFAIT_S après, oubliés (routes comprises)
// quand ils sont loin. Un carré lu reste une semaine dans le cache du
// navigateur : un aller-retour ne redemande rien au serveur.
const CARRE_M = 500;
// Les versions des carrés (carres.CARRES_VERSION, VEGETATION_VERSION), dans
// leur adresse : le navigateur garde un carré une semaine.
const CARRES_VERSION = 2, VEGETATION_VERSION = 2;
const AUTOUR_M = 450;
// Autour de la voiture quand la route prévue finit en impasse : bâtiments ;
// les arbres, plus lents à lire, sur VEG_IMPASSE_M.
const IMPASSE_RAYON_M = 1000;
const COULOIR_M = 350;
const PAS_COULOIR_M = 100;
const CARRES_VOULUS_MAX = 90;
const CARRES_PARALLELE = 4;
const CARRE_DEFAIT_S = 20;
const CARRE_OUBLI_S = 120, CARRE_OUBLI_M = 4000;
const carres = new Map();
let carresEnVol = 0;
let derniereSelectionCarres = -Infinity;
const groupeBati = new THREE.Group();
scene.add(groupeBati);

function carre(i, j) {
    const cle = `${i},${j}`;
    let c = carres.get(cle);
    if (!c) {
        c = { i, j, cle, etat: 'neuf', donnees: null, mesh: null, voulu: 0, reessai: 0, priorite: Infinity,
              altiPretes: false, nbBatiments: 0,
              veg: { etat: 'neuf', donnees: null, mesh: null, voulu: 0, reessai: 0, priorite: Infinity,
                     altiPretes: false } };
        carres.set(cle, c);
    }
    return c;
}
const carreDe = (x, y) => carres.get(`${Math.floor(x / CARRE_M)},${Math.floor(y / CARRE_M)}`);

async function chargerCarre(c) {
    c.etat = 'charge';
    carresEnVol++;
    try {
        const reponse = await fetch(`api/carre?i=${c.i}&j=${c.j}&v=${CARRES_VERSION}`);
        if (reponse.status === 422) { c.etat = 'hors'; return; }
        if (!reponse.ok) {
            c.etat = 'erreur';
            c.reessai = performance.now() + (Number(reponse.headers.get('retry-after')) || 15) * 1000;
            if (reponse.status === 429) annoncer('Trop de carrés demandés en une heure : le serveur en refuse pour l\'instant.');
            return;
        }
        c.donnees = await reponse.json();
        c.etat = 'pret';
        integrerRoutes(c);
        const coins = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([u, v]) =>
            depuisLambert93((c.i + u) * CARRE_M, (c.j + v) * CARRE_M));
        const lons = coins.map(p => p[0]), lats = coins.map(p => p[1]);
        preparerAltitudes(Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats), NIVEAU_PROCHE)
            .then(() => { c.altiPretes = true; }, () => { c.altiPretes = true; });
        // La route prévue s'arrêtait peut-être au bord de ce carré.
        voiture.recalculer = true;
    } catch (e) {
        c.etat = 'erreur';
        c.reessai = performance.now() + 15000;
    } finally {
        carresEnVol--;
    }
}

// Teintes claires, lisibles sur la photo comme sur le plan ; les toits en
// pente en tuile au sud, en ardoise au nord de la Loire.
const TEINTES_MURS = {
    'Résidentiel': 0xe6dccb, 'Commercial et services': 0xd5dde5, 'Industriel': 0xc6cbd0,
    'Agricole': 0xd9cdb0, 'Religieux': 0xeee0c2, 'Sportif': 0xd0ddcc, 'Annexe': 0xd8d3ca,
};
const TEINTE_MURS = 0xd4cfc7;
const TEINTE_TOIT_PLAT = 0xaeb3b8;
const TEINTE_TUILE = 0xb5694c, TEINTE_ARDOISE = 0x6f7884;
const LAT_ARDOISE = 47.3;
// Mêmes règles que la page : 3 m par étage, et un toit à deux pans d'au plus
// 0,6 fois sa largeur de dénivelé (la BD TOPO annonçait un toit à 67° au
// Mont-Saint-Michel). Les murs descendent sous le sol BD TOPO : le relief
// lissé du RGE ALTI s'en écarte d'un mètre ou deux sur une pente.
const HAUTEUR_PAR_ETAGE = 3;
const PENTE_TOIT_MAX = 0.6;
const ENFONCEMENT_M = 4;
// Toit à deux pans seulement sur une emprise presque rectangulaire et pas
// trop large : ailleurs, le rectangle englobant en inventerait la forme.
const RECTANGLE_MIN = 0.85, LARGEUR_PIGNON_MAX = 24;
// Entre la caméra et la voiture, les bâtiments s'ajourent (un pixel sur
// quatre gardé, en tramage) dans un cône qui s'élargit vers elle : en rue
// étroite, les façades de 25 m de la rue de Berri la cachaient.
const uniformsBati = { uVoiture: { value: new THREE.Vector3() }, uRayon: { value: 0 } };
/**
 * Courbure (comme courber) et ajourage, en tramage, dans le cône qui va de
 * la caméra à la voiture ; `proche` ([début, fin] en mètres) efface en plus
 * ce qui frôle la caméra : basse, elle passait dans la canopée de Gordes.
 */
function ajourer(materiau, cle, proche = null) {
    materiau.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, uniformsBati);
    shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vMonde;')
        .replace('#include <project_vertex>',
            'vec4 mondeP = vec4(transformed, 1.0);\n'
            + '#ifdef USE_INSTANCING\nmondeP = instanceMatrix * mondeP;\n#endif\n'
            + 'mondeP = modelMatrix * mondeP;\n'
            + 'vMonde = mondeP.xyz;\n'
            + 'vec2 ecartCam = mondeP.xz - cameraPosition.xz;\n'
            + `mondeP.y -= dot(ecartCam, ecartCam) * ${COURBURE.toExponential(8)};\n`
            + 'vec4 mvPosition = viewMatrix * mondeP;\n'
            + 'gl_Position = projectionMatrix * mvPosition;');
    shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vMonde;\nuniform vec3 uVoiture;\nuniform float uRayon;')
        .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n'
            + 'float ajour = 0.0;\n'
            + 'if (uRayon > 0.0) {\n'
            + '  vec3 axe = uVoiture - cameraPosition;\n'
            + '  float l = length(axe);\n'
            + '  vec3 dir = axe / l;\n'
            + '  float t = dot(vMonde - cameraPosition, dir);\n'
            + '  if (t > 0.0 && t < l + 3.0) {\n'
            + '    float r = uRayon * (0.3 + 0.7 * min(t / l, 1.0));\n'
            + '    float d = length(vMonde - cameraPosition - dir * t);\n'
            + '    ajour = 0.75 * (1.0 - smoothstep(0.7 * r, r, d));\n'
            + '  }\n'
            + '}\n'
            + (proche ? `ajour = max(ajour, 1.0 - smoothstep(${proche[0].toFixed(1)}, ${proche[1].toFixed(1)}, distance(vMonde, cameraPosition)));\n` : '')
            + 'if (ajour > 0.0 && fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))) < ajour) discard;');
    };
    materiau.customProgramCacheKey = () => cle;
    return materiau;
}
// L'angle de vue ne change jamais pour un obstacle : une caméra qui montait
// au-dessus des toits voisins sautait sans cesse dans un village, et Yannick
// n'en a pas voulu. Ce sont les obstacles qui s'effacent : tout bâtiment à
// moins de 6 m de la caméra (elle est dans un îlot quand la rue tourne
// derrière la voiture), estompé jusqu'à 22 m, et ceux qui la séparent de la
// voiture (le cône).
const BATI_PROCHES_M = [6, 22];
const MAT_BATI = ajourer(new THREE.MeshLambertMaterial({ vertexColors: true }), 'bati', BATI_PROCHES_M);

function aireAnneau(p) {
    let a = 0;
    for (let k = 0, n = p.length / 2; k < n; k++) {
        const l = (k + 1) % n;
        a += p[2 * k] * p[2 * l + 1] - p[2 * l] * p[2 * k + 1];
    }
    return a / 2;
}

/** Le plus petit rectangle englobant (enveloppe convexe, un côté sur une arête). */
function rectangleMin(p) {
    const pts = [];
    for (let k = 0; k < p.length; k += 2) pts.push([p[k], p[k + 1]]);
    pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const croix = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const bas = [], haut = [];
    for (const q of pts) { while (bas.length >= 2 && croix(bas[bas.length - 2], bas[bas.length - 1], q) <= 0) bas.pop(); bas.push(q); }
    for (let k = pts.length - 1; k >= 0; k--) { const q = pts[k]; while (haut.length >= 2 && croix(haut[haut.length - 2], haut[haut.length - 1], q) <= 0) haut.pop(); haut.push(q); }
    const env = bas.slice(0, -1).concat(haut.slice(0, -1));
    let meilleur = null;
    for (let k = 0; k < env.length; k++) {
        const a = env[k], b = env[(k + 1) % env.length];
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), c = Math.cos(ang), s = Math.sin(ang);
        let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
        for (const q of env) {
            const u = q[0] * c + q[1] * s, v = -q[0] * s + q[1] * c;
            u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v);
        }
        const aire = (u1 - u0) * (v1 - v0);
        if (!meilleur || aire < meilleur.aire) meilleur = { aire, ang, u0, u1, v0, v1 };
    }
    if (!meilleur) return null;
    let { ang, u0, u1, v0, v1 } = meilleur;
    // L'axe u, celui du faîtage, le long du grand côté.
    if (v1 - v0 > u1 - u0) { ang += Math.PI / 2; [u0, u1, v0, v1] = [v0, v1, -u1, -u0]; }
    const c = Math.cos(ang), s = Math.sin(ang), um = (u0 + u1) / 2, vm = (v0 + v1) / 2;
    return { aire: meilleur.aire, longueur: u1 - u0, largeur: v1 - v0,
             cx: um * c - vm * s, cy: um * s + vm * c, ux: c, uy: s, vx: -s, vy: c };
}

/**
 * Les bâtiments d'un carré en un seul maillage (un appel de dessin) :
 * murs extrudés de l'emprise, toit à deux pans sur un rectangle, sinon
 * plat. Sommets relatifs au centre du carré, en coordonnées de la scène
 * (X est, Y altitude, Z sud), une normale par face.
 */
function construireCarre(c) {
    const d = c.donnees;
    const cx = (c.i + 0.5) * CARRE_M, cy = (c.j + 0.5) * CARRE_M;
    const [ox, oy] = d.origine;
    const dx = ox - cx, dy = oy - cy;
    const pos = [], nor = [], col = [];
    const couleur = new THREE.Color(), teinte = new THREE.Color();
    const ardoise = depuisLambert93(cx, cy)[1] > LAT_ARDOISE;
    const va = new THREE.Vector3(), vb = new THREE.Vector3(), vn = new THREE.Vector3();
    // Un triangle (x, alt, y locaux, y vers le nord), tourné pour que sa
    // normale suive `ref` (ex, ey, ez) : vers le dehors, ou vers le ciel.
    const tri = (a, b, e, ref, ca, cb = ca, ce = ca) => {
        const A = [a[0], a[1], -a[2]], B = [b[0], b[1], -b[2]], E = [e[0], e[1], -e[2]];
        va.set(B[0] - A[0], B[1] - A[1], B[2] - A[2]);
        vb.set(E[0] - A[0], E[1] - A[1], E[2] - A[2]);
        vn.crossVectors(va, vb);
        if (vn.lengthSq() < 1e-8) return;
        let P = [A, B, E], C = [ca, cb, ce];
        if (vn.x * ref[0] + vn.y * ref[1] - vn.z * ref[2] < 0) { P = [A, E, B]; C = [ca, ce, cb]; vn.negate(); }
        vn.normalize();
        for (let q = 0; q < 3; q++) {
            pos.push(P[q][0], P[q][1], P[q][2]); nor.push(vn.x, vn.y, vn.z); col.push(C[q].r, C[q].g, C[q].b);
        }
    };
    const pied = new THREE.Color();
    let n = 0;
    for (const b of d.batiments) {
        for (const poly of b.polygones) {
            // Anneaux en mètres, relatifs au centre ; sans le sommet de fermeture.
            const anneaux = poly.map(a => {
                const p = [];
                for (let k = 0; k + 1 < a.length; k += 2) p.push(a[k] / 10 + dx, a[k + 1] / 10 + dy);
                if (p.length >= 4 && p[0] === p[p.length - 2] && p[1] === p[p.length - 1]) p.length -= 2;
                return p;
            }).filter(p => p.length >= 6);
            if (!anneaux.length) continue;
            // Extérieur dans le sens trigonométrique, trous dans l'autre.
            anneaux.forEach((p, k) => {
                if ((aireAnneau(p) > 0) !== (k === 0)) {
                    const r = [];
                    for (let q = p.length - 2; q >= 0; q -= 2) r.push(p[q], p[q + 1]);
                    p.splice(0, p.length, ...r);
                }
            });
            const ext = anneaux[0];
            let mx = 0, my = 0;
            for (let k = 0; k < ext.length; k += 2) { mx += ext[k]; my += ext[k + 1]; }
            mx /= ext.length / 2; my /= ext.length / 2;
            let sol = b.sol;
            if (sol == null) {
                const a = altitudeL93(cx + mx, cy + my);
                sol = Number.isFinite(a) ? a : 0;
            }
            const gout = b.gouttiere, fait = b.faitage;
            let hMur = gout != null && gout > sol + 0.5 ? gout - sol
                : b.hauteur > 0 ? b.hauteur : b.etages > 0 ? HAUTEUR_PAR_ETAGE * b.etages : 4;
            hMur = Math.min(Math.max(hMur, 2), 350);
            const bas = sol - ENFONCEMENT_M, haut = sol + hMur;
            couleur.setHex(TEINTES_MURS[b.usage] || TEINTE_MURS);
            // Un écart de teinte par bâtiment : des voisins accolés se
            // distinguent ; et un pied plus sombre, qui pose les façades.
            const h = (n * 2654435761 >>> 0) / 4294967296;
            couleur.multiplyScalar(0.88 + 0.16 * h);
            pied.copy(couleur).multiplyScalar(0.62);
            n++;
            for (const p of anneaux) {
                const m = p.length / 2;
                for (let k = 0; k < m; k++) {
                    const l = (k + 1) % m;
                    const ax = p[2 * k], ay = p[2 * k + 1], bx = p[2 * l], by = p[2 * l + 1];
                    const dehors = [by - ay, 0, -(bx - ax)];
                    tri([ax, bas, ay], [bx, bas, by], [bx, haut, by], dehors, pied, pied, couleur);
                    tri([ax, bas, ay], [bx, haut, by], [ax, haut, ay], dehors, pied, couleur, couleur);
                }
            }
            const den = gout != null && fait != null ? fait - gout : 0;
            const aire = aireAnneau(ext) + anneaux.slice(1).reduce((s, p) => s + aireAnneau(p), 0);
            const r = den > 0.5 && anneaux.length === 1 ? rectangleMin(ext) : null;
            if (r && aire / r.aire >= RECTANGLE_MIN && r.largeur <= LARGEUR_PIGNON_MAX) {
                const f = Math.min(den, PENTE_TOIT_MAX * r.largeur);
                const L = r.longueur / 2, W = r.largeur / 2;
                const pt = (u, v, z) => [r.cx + u * r.ux + v * r.vx, z, r.cy + u * r.uy + v * r.vy];
                const a1 = pt(L, W, haut), a2 = pt(-L, W, haut), a3 = pt(-L, -W, haut), a4 = pt(L, -W, haut);
                const f1 = pt(L, 0, haut + f), f2 = pt(-L, 0, haut + f);
                teinte.setHex(ardoise ? TEINTE_ARDOISE : TEINTE_TUILE).multiplyScalar(0.92 + 0.12 * h);
                const versV = [r.vx, 1, r.vy], versMoinsV = [-r.vx, 1, -r.vy];
                tri(a1, a2, f2, versV, teinte); tri(a1, f2, f1, versV, teinte);
                tri(a3, a4, f1, versMoinsV, teinte); tri(a3, f1, f2, versMoinsV, teinte);
                tri(a4, a1, f1, [r.ux, 0, r.uy], couleur);
                tri(a2, a3, f2, [-r.ux, 0, -r.uy], couleur);
            } else {
                const contour = [], trous = [];
                for (let k = 0; k < ext.length; k += 2) contour.push(new THREE.Vector2(ext[k], ext[k + 1]));
                for (const p of anneaux.slice(1)) {
                    const t = [];
                    for (let k = 0; k < p.length; k += 2) t.push(new THREE.Vector2(p[k], p[k + 1]));
                    trous.push(t);
                }
                // Les indices rendus courent sur le contour puis les trous,
                // tels que triangulateShape les laisse.
                const faces = THREE.ShapeUtils.triangulateShape(contour, trous);
                const tous = contour.concat(...trous);
                teinte.setHex(TEINTE_TOIT_PLAT).multiplyScalar(0.86 + 0.2 * h);
                for (const [i0, i1, i2] of faces) {
                    const A = tous[i0], B = tous[i1], E = tous[i2];
                    tri([A.x, haut, A.y], [B.x, haut, B.y], [E.x, haut, E.y], [0, 1, 0], teinte);
                }
            }
        }
    }
    c.nbBatiments = n;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    geo.computeBoundingSphere();
    c.mesh = new THREE.Mesh(geo, MAT_BATI);
    ancrer(c.mesh, cx, cy);
    groupeBati.add(c.mesh);
    c.routes = construireRoutes(c, cx, cy);
    ancrer(c.routes, cx, cy);
    groupeRoutes.add(c.routes);
}

function defaireCarre(c) {
    if (!c.mesh) return;
    groupeBati.remove(c.mesh);
    ancres.delete(c.mesh);
    c.mesh.geometry.dispose();
    c.mesh = null;
    if (c.routes) {
        groupeRoutes.remove(c.routes);
        ancres.delete(c.routes);
        for (const m of c.routes.children) m.geometry.dispose();
        c.routes = null;
    }
}

// --- Routes et ponts ----------------------------------------------------------------
// Les tronçons du carré, découpés à son bord : un viaduc à cheval sur trois
// carrés est dessiné par chacun, et ne disparaît pas sous la voiture quand
// le premier est défait. Au sol, des rubans à la largeur de chaussée de la
// BD TOPO, comme dans la scène (largeurs, teintes : construireRoutes de
// index.html), effacés sur le plan, qui dessine déjà les routes et leurs
// noms. Un pont (position au-dessus du sol) est un tablier à l'altitude de
// ses tronçons — celle du tablier : de 598 à 676 m sur le viaduc de Millau,
// sa pente de 3 % —, avec ses parapets, et des piles là où le vide dépasse
// PILE_VIDE_M. Le relief du RGE ALTI, sol nu, passe dessous. Les tunnels ne
// sont pas dessinés.
const ROUTE_LEVE_M = 0.12, ROUTE_PAS_M = 5, PONT_PAS_M = 6;
const PONT_EPAISSEUR_M = 1.4, PARAPET_M = 0.9, PILE_ECART_M = 45, PILE_VIDE_M = 3, PILE_EPAISSEUR_M = 1.6;
const LARGEUR_PAR_NATURE = {
    'Type autoroutier': 7, 'Route à 1 chaussée': 3, 'Route à 2 chaussées': 5.5, 'Rond-point': 4, 'Bretelle': 4,
    'Route empierrée': 3, 'Chemin': 2.5,
};
const NATURES_TERRE = new Set(['Route empierrée', 'Chemin']);
// À 60 % : opaques, les rubans effaçaient l'asphalte et les marquages de la
// photo (A7, avenue George V) ; la route reste lisible, la photo passe.
const OPACITE_ROUTE = 0.6;
const MAT_ROUTE = courber(new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true,
    opacity: OPACITE_ROUTE, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -4 }));
const MAT_PONT = courber(new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
const COULEUR_ROUTE = new THREE.Color(0x5f636a), COULEUR_CHEMIN = new THREE.Color(0x9c8a6e);
const COULEUR_BETON = new THREE.Color(0xc9c5bb);
const groupeRoutes = new THREE.Group();
scene.add(groupeRoutes);
const montrerRoutesAuSol = () => { MAT_ROUTE.visible = fond === 'ortho'; };

/** Les morceaux d'une polyligne (x, y, z absolus) dans le carré [x0, x1] × [y0, y1] (Liang-Barsky). */
function decouper(xs, ys, zs, x0, y0, x1, y1) {
    const morceaux = [];
    let cour = null;
    for (let k = 0; k + 1 < xs.length; k++) {
        const dx = xs[k + 1] - xs[k], dy = ys[k + 1] - ys[k];
        const p = [-dx, dx, -dy, dy], q = [xs[k] - x0, x1 - xs[k], ys[k] - y0, y1 - ys[k]];
        let t0 = 0, t1 = 1, dedans = true;
        for (let i = 0; i < 4 && dedans; i++) {
            if (p[i] === 0) dedans = q[i] >= 0;
            else if (p[i] < 0) t0 = Math.max(t0, q[i] / p[i]);
            else t1 = Math.min(t1, q[i] / p[i]);
        }
        if (!dedans || t0 >= t1) { cour = null; continue; }
        const point = t => [xs[k] + dx * t, ys[k] + dy * t, zs[k] + (zs[k + 1] - zs[k]) * t];
        if (!cour || t0 > 0) { cour = [point(t0)]; morceaux.push(cour); }
        cour.push(point(t1));
        if (t1 < 1) cour = null;
    }
    return morceaux;
}

/** Points tous les `pas` mètres le long d'un morceau, avec leur direction (ux, uy). */
function echantillonner(morceau, pas) {
    const pts = [];
    for (let k = 0; k + 1 < morceau.length; k++) {
        const [ax, ay, az] = morceau[k], [bx, by, bz] = morceau[k + 1];
        const l = Math.hypot(bx - ax, by - ay);
        if (l < 0.01) continue;
        const n = Math.max(1, Math.ceil(l / pas));
        for (let i = k && pts.length ? 1 : 0; i <= n; i++) {
            const t = i / n;
            pts.push({ x: ax + (bx - ax) * t, y: ay + (by - ay) * t, z: az + (bz - az) * t });
        }
    }
    for (let i = 0; i < pts.length; i++) {
        const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, pts.length - 1)];
        const l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        pts[i].ux = (b.x - a.x) / l; pts[i].uy = (b.y - a.y) / l;
    }
    return pts;
}

function construireRoutes(c, cx, cy) {
    const d = c.donnees;
    const [ox, oy] = d.origine;
    const x0 = c.i * CARRE_M, y0 = c.j * CARRE_M;
    const sol = { pos: [], nor: [], col: [] }, pont = { pos: [], nor: [], col: [] };
    // Un triangle en coordonnées de la scène relatives au centre du carré,
    // tourné pour que sa normale suive `n`.
    const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), vn = new THREE.Vector3();
    const tri = (cible, A, B, C, n, coul) => {
        v1.set(B[0] - A[0], B[1] - A[1], B[2] - A[2]);
        v2.set(C[0] - A[0], C[1] - A[1], C[2] - A[2]);
        vn.crossVectors(v1, v2);
        if (vn.lengthSq() < 1e-10) return;
        const P = vn.x * n[0] + vn.y * n[1] + vn.z * n[2] < 0 ? [A, C, B] : [A, B, C];
        for (const q of P) { cible.pos.push(q[0], q[1], q[2]); cible.nor.push(n[0], n[1], n[2]); cible.col.push(coul.r, coul.g, coul.b); }
    };
    const quad = (cible, A, B, C, D, n, coul) => { tri(cible, A, B, C, n, coul); tri(cible, A, C, D, n, coul); };
    const ici = (x, y, alt) => [x - cx, alt, cy - y];
    for (const r of d.routes) {
        if (r.sol < 0 || r.fictif || r.nature === 'Bac ou liaison maritime') continue;
        const n = r.ligne.length / 3, xs = [], ys = [], zs = [];
        for (let k = 0; k < n; k++) {
            xs.push(ox + r.ligne[3 * k] / 10); ys.push(oy + r.ligne[3 * k + 1] / 10);
            zs.push(r.ligne[3 * k + 2] == null ? NaN : r.ligne[3 * k + 2] / 10);
        }
        const largeur = r.largeur > 0 ? r.largeur : LARGEUR_PAR_NATURE[r.nature] || 3;
        for (const morceau of decouper(xs, ys, zs, x0, y0, x0 + CARRE_M, y0 + CARRE_M)) {
            if (r.sol === 0) {
                const coul = NATURES_TERRE.has(r.nature) ? COULEUR_CHEMIN : COULEUR_ROUTE;
                const pts = echantillonner(morceau, ROUTE_PAS_M);
                let prec = null;
                for (const p of pts) {
                    const a = altitudeL93(p.x, p.y);
                    const alt = (Number.isFinite(a) ? a : 0) + ROUTE_LEVE_M;
                    const gx = -p.uy * largeur / 2, gy = p.ux * largeur / 2;
                    const g = ici(p.x + gx, p.y + gy, alt), dr = ici(p.x - gx, p.y - gy, alt);
                    if (prec) quad(sol, prec[1], dr, g, prec[0], [0, 1, 0], coul);
                    prec = [g, dr];
                }
                continue;
            }
            // Un pont : tablier, parapets, piles.
            const pts = echantillonner(morceau, PONT_PAS_M);
            const w = largeur + 1;
            let prec = null, parcouru = 0, pile = PILE_ECART_M / 2;
            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                let z = p.z;
                if (!Number.isFinite(z)) { const a = altitudeL93(p.x, p.y); z = (Number.isFinite(a) ? a : 0) + 5; }
                const gx = -p.uy * w / 2, gy = p.ux * w / 2;
                const haut = [ici(p.x + gx, p.y + gy, z + 0.05), ici(p.x - gx, p.y - gy, z + 0.05)];
                const bas = [ici(p.x + gx, p.y + gy, z - PONT_EPAISSEUR_M), ici(p.x - gx, p.y - gy, z - PONT_EPAISSEUR_M)];
                const garde = [ici(p.x + gx, p.y + gy, z + PARAPET_M), ici(p.x - gx, p.y - gy, z + PARAPET_M)];
                const lat = [-p.uy, 0, -p.ux];   // vers la gauche, en coordonnées de la scène
                if (prec) {
                    quad(pont, prec.haut[1], haut[1], haut[0], prec.haut[0], [0, 1, 0], COULEUR_ROUTE);
                    quad(pont, prec.bas[0], bas[0], bas[1], prec.bas[1], [0, -1, 0], COULEUR_BETON);
                    quad(pont, prec.haut[0], haut[0], bas[0], prec.bas[0], lat, COULEUR_BETON);
                    quad(pont, prec.haut[1], haut[1], bas[1], prec.bas[1], [-lat[0], 0, -lat[2]], COULEUR_BETON);
                    quad(pont, prec.haut[0], haut[0], garde[0], prec.garde[0], lat, COULEUR_BETON);
                    quad(pont, prec.haut[1], haut[1], garde[1], prec.garde[1], [-lat[0], 0, -lat[2]], COULEUR_BETON);
                    parcouru += Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y);
                }
                prec = { haut, bas, garde };
                if (parcouru < pile) continue;
                pile += PILE_ECART_M;
                const a = altitudeL93(p.x, p.y);
                if (!Number.isFinite(a) || z - PONT_EPAISSEUR_M - a < PILE_VIDE_M) continue;
                // Une pile, un voile de la moitié du tablier, dans l'axe.
                const e = PILE_EPAISSEUR_M / 2, l = Math.max(w * 0.25, e);
                const coin = (u, v, alt) => ici(p.x + p.ux * u - p.uy * v, p.y + p.uy * u + p.ux * v, alt);
                const pied = a - 1, tete = z - PONT_EPAISSEUR_M;
                const c4 = [[e, l], [e, -l], [-e, -l], [-e, l]];
                for (let k = 0; k < 4; k++) {
                    const [u0, w0] = c4[k], [u1, w1] = c4[(k + 1) % 4];
                    const nu = (u0 + u1) / 2, nv = (w0 + w1) / 2, nl = Math.hypot(nu, nv) || 1;
                    const nx = (p.ux * nu - p.uy * nv) / nl, ny = (p.uy * nu + p.ux * nv) / nl;
                    quad(pont, coin(u0, w0, pied), coin(u1, w1, pied), coin(u1, w1, tete), coin(u0, w0, tete),
                         [nx, 0, -ny], COULEUR_BETON);
                }
            }
        }
    }
    const groupe = new THREE.Group();
    for (const [donnees, materiau] of [[sol, MAT_ROUTE], [pont, MAT_PONT]]) {
        if (!donnees.pos.length) continue;
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(donnees.pos, 3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(donnees.nor, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(donnees.col, 3));
        geo.computeBoundingSphere();
        const m = new THREE.Mesh(geo, materiau);
        // Avant les arbres translucides, qui se mêlent ainsi par-dessus.
        if (materiau === MAT_ROUTE) m.renderOrder = -1;
        groupe.add(m);
    }
    return groupe;
}

// --- Les arbres ---------------------------------------------------------------------
// Ceux de la scène (vue3d/houppiers.py), découpés sur le MNH du LiDAR HD
// carré par carré (/api/vegetation) : 1 à 5 s de lecture par carré au
// serveur, contre 0,2 s pour les bâtiments. D'où une bande plus étroite :
// les arbres à plus de 250 m de la route se perdent dans la photo.
const VEG_AUTOUR_M = 300, VEG_COULOIR_M = 250, VEG_DEVANT_M = 2000, VEG_IMPASSE_M = 500;
const VEG_PARALLELE = 2;
let vegEnVol = 0;
let arbresActifs = PARAMS.get('arbres') !== '0';
// Les ports de la page (PORTS de index.html) : palette, part de fût nu, et
// une forme simple. Le serveur classe chaque arbre (carres.port).
const PORTS_ARBRES = {
    feuillu:    { base: 0x5e8a3e, cime: 0x9cc06a, tronc: 0.42, forme: 'boule' },
    chene_vert: { base: 0x3f6b33, cime: 0x6f9a55, tronc: 0.38, forme: 'boule' },
    pin:        { base: 0x4f7a4a, cime: 0x8fb27a, tronc: 0.52, forme: 'boule' },
    conifere:   { base: 0x3e6a3c, cime: 0x6d9a63, tronc: 0.12, forme: 'cone' },
    peuplier:   { base: 0x76a24e, cime: 0xb2d37f, tronc: 0.38, forme: 'colonne' },
    arbuste:    { base: 0x6a8e44, cime: 0xa2c46e, tronc: 0, forme: 'boule' },
};
for (const p of Object.values(PORTS_ARBRES)) { p.base = new THREE.Color(p.base); p.cime = new THREE.Color(p.cime); }
// Peu de faces : jusqu'à 9 000 arbres par carré à Gordes (garrigue comprise).
const GEO_BOULE = new THREE.IcosahedronGeometry(1, 0);                         // 20 faces
const GEO_CONE = new THREE.ConeGeometry(1, 1, 7, 1, true).translate(0, 0.5, 0);  // 7 faces
const GEO_FUT = new THREE.CylinderGeometry(0.6, 1, 1, 5, 1, true).translate(0, 0.5, 0);
// Translucides, à la demande de Yannick : opaques, les houppiers cachaient
// la route et les façades derrière eux. Moins que dans la scène (30 %), où
// le bâti est le sujet : vus de la route, à 30 %, ils ne se lisaient plus.
// depthWrite reste, sinon les faces d'un même houppier se mêleraient.
const OPACITE_FEUILLAGE = 0.45, OPACITE_FUT = 0.6;
// Effacés à moins de 15 m de la caméra, estompés jusqu'à 35 m.
const ARBRES_PROCHES_M = [15, 35];
const MAT_FEUILLAGE = ajourer(new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true,
    transparent: true, opacity: OPACITE_FEUILLAGE }), 'feuillage', ARBRES_PROCHES_M);
const MAT_FUT = ajourer(new THREE.MeshLambertMaterial({ color: 0x6b5240, transparent: true, opacity: OPACITE_FUT }),
    'fut', ARBRES_PROCHES_M);
const HAUTEUR_MIN_TRONC = 3;

/** Aléa déterministe d'une position : un arbre garde sa teinte d'un passage à l'autre. */
function alea(x, y) {
    const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return v - Math.floor(v);
}

async function chargerVegetation(c) {
    const g = c.veg;
    g.etat = 'charge';
    vegEnVol++;
    try {
        const reponse = await fetch(`api/vegetation?i=${c.i}&j=${c.j}&v=${VEGETATION_VERSION}`);
        if (reponse.status === 422) { g.etat = 'hors'; return; }
        if (!reponse.ok) {
            g.etat = 'erreur';
            g.reessai = performance.now() + (Number(reponse.headers.get('retry-after')) || 20) * 1000;
            return;
        }
        g.donnees = await reponse.json();
        g.etat = 'pret';
        const coins = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([u, v]) =>
            depuisLambert93((c.i + u) * CARRE_M, (c.j + v) * CARRE_M));
        const lons = coins.map(p => p[0]), lats = coins.map(p => p[1]);
        preparerAltitudes(Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats), NIVEAU_PROCHE)
            .then(() => { g.altiPretes = true; }, () => { g.altiPretes = true; });
    } catch (e) {
        g.etat = 'erreur';
        g.reessai = performance.now() + 20000;
    } finally {
        vegEnVol--;
    }
}

/**
 * Les arbres d'un carré en trois maillages instanciés (houppiers ronds,
 * cônes, fûts) : trois appels de dessin. Un arbre pose sur le relief au
 * pied de son sommet ; son houppier part du haut du fût nu de son port.
 */
function construireVegetation(c) {
    const d = c.veg.donnees;
    const cx = (c.i + 0.5) * CARRE_M, cy = (c.j + 0.5) * CARRE_M;
    const [ox, oy] = d.origine;
    const arbres = d.arbres, ports = d.ports.map(n => PORTS_ARBRES[n] || PORTS_ARBRES.feuillu);
    let nBoules = 0, nCones = 0, nFuts = 0;
    for (const a of arbres) {
        const p = ports[a[4]];
        if (p.forme === 'cone') nCones++; else nBoules++;
        if (a[2] >= HAUTEUR_MIN_TRONC * 10 && p.tronc >= 0.1) nFuts++;
    }
    const groupe = new THREE.Group();
    const boules = new THREE.InstancedMesh(GEO_BOULE, MAT_FEUILLAGE, Math.max(nBoules, 1));
    const cones = new THREE.InstancedMesh(GEO_CONE, MAT_FEUILLAGE, Math.max(nCones, 1));
    const futs = new THREE.InstancedMesh(GEO_FUT, MAT_FUT, Math.max(nFuts, 1));
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), ech = new THREE.Vector3();
    const teinte = new THREE.Color();
    let ib = 0, ic = 0, it = 0;
    for (const a of arbres) {
        const x = ox + a[0] / 10, y = oy + a[1] / 10, h = a[2] / 10, r = Math.max(a[3] / 10, 0.5);
        const p = ports[a[4]];
        let sol = altitudeL93(x, y);
        if (!Number.isFinite(sol)) sol = 0;
        const lx = x - cx, lz = cy - y;
        const bas = h < HAUTEUR_MIN_TRONC ? 0 : h * p.tronc;
        const al = alea(x, y);
        teinte.copy(p.base).lerp(p.cime, 0.25 + 0.5 * al).multiplyScalar(0.92 + 0.12 * alea(y, x));
        if (p.forme === 'cone') {
            pos.set(lx, sol + bas - 0.3, lz); ech.set(r, h - bas + 0.3, r);
            cones.setMatrixAt(ic, m.compose(pos, q, ech));
            cones.setColorAt(ic++, teinte);
        } else {
            const largeur = p.forme === 'colonne' ? r * 0.65 : r;
            pos.set(lx, sol + (bas + h) / 2, lz); ech.set(largeur, Math.max((h - bas) / 2, 0.4), largeur);
            boules.setMatrixAt(ib, m.compose(pos, q, ech));
            boules.setColorAt(ib++, teinte);
        }
        if (h >= HAUTEUR_MIN_TRONC && p.tronc >= 0.1) {
            const hT = h * p.tronc + Math.min(1, h * 0.1), rT = Math.min(Math.max(h / 20, 0.18), 0.6);
            pos.set(lx, sol - 0.5, lz); ech.set(rT, hT + 0.5, rT);
            futs.setMatrixAt(it++, m.compose(pos, q, ech));
        }
    }
    for (const [maillage, n] of [[boules, ib], [cones, ic], [futs, it]]) {
        maillage.count = n;
        if (!n) continue;
        maillage.instanceMatrix.needsUpdate = true;
        if (maillage.instanceColor) maillage.instanceColor.needsUpdate = true;
        maillage.computeBoundingSphere();
        groupe.add(maillage);
    }
    c.veg.mesh = groupe;
    c.veg.nb = arbres.length;
    ancrer(groupe, cx, cy);
    groupeArbres.add(groupe);
}

function defaireVegetation(c) {
    const g = c.veg;
    if (!g.mesh) return;
    groupeArbres.remove(g.mesh);
    ancres.delete(g.mesh);
    for (const maillage of g.mesh.children) maillage.dispose();
    g.mesh = null;
}

const groupeArbres = new THREE.Group();
scene.add(groupeArbres);
const boutonArbres = document.getElementById('b-arbres');
function majBoutonArbres() { boutonArbres.classList.toggle('on', arbresActifs); }
boutonArbres.addEventListener('click', () => {
    arbresActifs = !arbresActifs;
    groupeArbres.visible = arbresActifs;
    majBoutonArbres();
});
majBoutonArbres();

/**
 * Les carrés voulus et leur priorité, la distance à parcourir pour y être :
 * ceux à moins de `autour` de la voiture, et à moins de `couloir` de la
 * route prévue, sur `devant` mètres.
 */
function carresVoulus(autour = AUTOUR_M, couloir = COULOIR_M, devant = Infinity, impasse = IMPASSE_RAYON_M) {
    const voulus = new Map();
    const ajouter = (x, y, rayon, prio) => {
        const i0 = Math.floor((x - rayon) / CARRE_M), i1 = Math.floor((x + rayon) / CARRE_M);
        const j0 = Math.floor((y - rayon) / CARRE_M), j1 = Math.floor((y + rayon) / CARRE_M);
        for (let i = i0; i <= i1; i++) {
            for (let j = j0; j <= j1; j++) {
                const ex = Math.max(i * CARRE_M - x, 0, x - (i + 1) * CARRE_M);
                const ey = Math.max(j * CARRE_M - y, 0, y - (j + 1) * CARRE_M);
                const d = Math.hypot(ex, ey);
                if (d > rayon) continue;
                const cle = `${i},${j}`, p = prio + d;
                if (!(voulus.get(cle)?.p <= p)) voulus.set(cle, { i, j, p });
            }
